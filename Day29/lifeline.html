<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Operation Lifeline: Supply Chain Crisis Lab</title>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  :root{
    --bg-0:#080b14;
    --bg-1:#0e1424;
    --bg-2:#141c33;
    --card:#131a2c;
    --card-hover:#1b2440;
    --border:#232d4d;
    --text-0:#eef1fb;
    --text-1:#aab3d1;
    --text-2:#717ea3;
    --accent:#5b8cff;
    --accent-2:#7c5cff;
    --teal:#26d0ce;
    --good:#2fd18b;
    --warn:#f5b93d;
    --bad:#ff5c7a;
    --shadow: 0 10px 30px rgba(0,0,0,0.45);
    --radius: 18px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1200px 600px at 10% -10%, rgba(91,140,255,0.14), transparent 60%),
      radial-gradient(1000px 700px at 100% 0%, rgba(124,92,255,0.12), transparent 55%),
      var(--bg-0);
    color:var(--text-0);
    font-family: 'Segoe UI', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    min-height:100vh;
  }
  #root{min-height:100vh;}
  .app-shell{
    max-width:1180px;
    margin:0 auto;
    padding:28px 20px 80px;
  }
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:26px;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:10px;
    font-weight:700;
    letter-spacing:0.3px;
    font-size:15px;
    color:var(--text-1);
  }
  .brand .dot{
    width:10px;height:10px;border-radius:50%;
    background:linear-gradient(135deg,var(--accent),var(--teal));
    box-shadow:0 0 12px rgba(91,140,255,0.8);
  }
  .step-track{
    display:flex;
    gap:6px;
    flex-wrap:wrap;
  }
  .step-pill{
    font-size:11px;
    padding:5px 10px;
    border-radius:999px;
    border:1px solid var(--border);
    color:var(--text-2);
    background:var(--bg-1);
    transition:all .35s ease;
  }
  .step-pill.active{
    color:#fff;
    border-color:transparent;
    background:linear-gradient(135deg,var(--accent),var(--accent-2));
    box-shadow:0 4px 14px rgba(91,140,255,0.35);
  }
  .step-pill.done{
    color:var(--good);
    border-color:rgba(47,209,139,0.4);
  }

  .panel{
    background:linear-gradient(180deg, var(--bg-1), var(--bg-2));
    border:1px solid var(--border);
    border-radius:24px;
    padding:34px;
    box-shadow:var(--shadow);
    animation: fadeUp .5s ease;
  }
  @keyframes fadeUp{
    from{opacity:0; transform:translateY(14px);}
    to{opacity:1; transform:translateY(0);}
  }
  h1{font-size:34px;margin:0 0 8px;letter-spacing:-0.5px;}
  h2{font-size:24px;margin:0 0 6px;letter-spacing:-0.3px;}
  h3{font-size:17px;margin:0 0 6px;}
  p{color:var(--text-1);line-height:1.6;margin:0 0 10px;}
  .subtitle{color:var(--text-1);font-size:16px;max-width:640px;}
  .badge{
    display:inline-flex;align-items:center;gap:6px;
    font-size:11px;font-weight:700;letter-spacing:0.6px;text-transform:uppercase;
    padding:5px 12px;border-radius:999px;
    background:rgba(91,140,255,0.12);
    color:var(--accent);
    border:1px solid rgba(91,140,255,0.3);
    margin-bottom:16px;
  }
  .badge.urgent{background:rgba(255,92,122,0.14);color:var(--bad);border-color:rgba(255,92,122,0.35);}
  .badge.warn{background:rgba(245,185,61,0.14);color:var(--warn);border-color:rgba(245,185,61,0.35);}

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
    gap:16px;
    margin:22px 0;
  }
  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:16px;
    padding:18px;
    transition:all .25s ease;
  }
  .card:hover{
    background:var(--card-hover);
    transform:translateY(-3px);
    border-color:rgba(91,140,255,0.4);
    box-shadow:0 8px 22px rgba(0,0,0,0.35);
  }
  .card .k{font-size:11px;text-transform:uppercase;letter-spacing:0.8px;color:var(--text-2);margin-bottom:8px;}
  .card .v{font-size:22px;font-weight:700;color:var(--text-0);}
  .card .v small{font-size:12px;color:var(--text-2);font-weight:500;}
  .chip-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
  .chip{
    font-size:11px;padding:4px 9px;border-radius:8px;
    background:rgba(255,255,255,0.05);
    border:1px solid var(--border);
    color:var(--text-1);
  }

  .btn{
    appearance:none;border:none;cursor:pointer;
    font-family:inherit;font-weight:700;font-size:14.5px;
    padding:13px 26px;border-radius:12px;
    background:linear-gradient(135deg,var(--accent),var(--accent-2));
    color:#fff;
    box-shadow:0 8px 20px rgba(91,140,255,0.3);
    transition:transform .18s ease, box-shadow .18s ease, opacity .18s ease;
  }
  .btn:hover{transform:translateY(-2px);box-shadow:0 12px 26px rgba(91,140,255,0.42);}
  .btn:active{transform:translateY(0px) scale(0.98);}
  .btn:disabled{opacity:0.4;cursor:not-allowed;transform:none;box-shadow:none;}
  .btn.secondary{
    background:var(--bg-2);
    border:1px solid var(--border);
    box-shadow:none;
    color:var(--text-0);
  }
  .btn.secondary:hover{background:var(--card-hover);}
  .btn.ghost{
    background:transparent;
    border:1px solid var(--border);
    color:var(--text-1);
    box-shadow:none;
  }
  .btn-row{display:flex;gap:12px;flex-wrap:wrap;margin-top:26px;}

  .action-card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:16px;
    padding:18px;
    cursor:pointer;
    transition:all .22s ease;
    position:relative;
  }
  .action-card:hover{border-color:rgba(91,140,255,0.45);transform:translateY(-2px);}
  .action-card.selected{
    border-color:var(--accent);
    background:linear-gradient(180deg, rgba(91,140,255,0.12), rgba(124,92,255,0.06));
    box-shadow:0 0 0 1px rgba(91,140,255,0.5) inset;
  }
  .action-card .check{
    position:absolute;top:14px;right:14px;
    width:22px;height:22px;border-radius:7px;
    border:1.5px solid var(--border);
    display:flex;align-items:center;justify-content:center;
    font-size:13px;color:transparent;
    transition:all .2s ease;
  }
  .action-card.selected .check{
    background:var(--accent);border-color:var(--accent);color:#fff;
  }
  .action-why{
    margin-top:10px;font-size:12.5px;color:var(--text-2);
    background:rgba(255,255,255,0.03);
    border-left:2px solid var(--accent-2);
    padding:8px 10px;border-radius:6px;
  }

  .metric-block{margin-bottom:16px;}
  .metric-label{
    display:flex;justify-content:space-between;align-items:center;
    font-size:13px;color:var(--text-1);margin-bottom:6px;font-weight:600;
  }
  .metric-label span.val{color:var(--text-0);font-weight:700;}
  .bar-track{
    width:100%;height:11px;border-radius:999px;
    background:rgba(255,255,255,0.06);
    overflow:hidden;
    border:1px solid var(--border);
  }
  .bar-fill{
    height:100%;border-radius:999px;
    transition:width 0.9s cubic-bezier(.2,.9,.25,1);
  }

  .option-btn{
    display:block;width:100%;text-align:left;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:14px;
    padding:16px 18px;
    color:var(--text-0);
    font-size:14.5px;
    cursor:pointer;
    margin-bottom:12px;
    transition:all .2s ease;
    font-family:inherit;
  }
  .option-btn:hover{
    border-color:var(--accent);
    background:var(--card-hover);
    transform:translateX(4px);
  }
  .option-btn .tone{
    font-size:11px;text-transform:uppercase;letter-spacing:0.6px;
    color:var(--accent);font-weight:700;margin-bottom:4px;display:block;
  }

  .scoreboard{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:18px;
    margin:26px 0;
  }
  .score-ring-card{
    background:var(--card);border:1px solid var(--border);
    border-radius:18px;padding:22px;text-align:center;
  }
  .big-score{
    font-size:64px;font-weight:800;
    background:linear-gradient(135deg,var(--teal),var(--accent));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    line-height:1;
  }
  .divider{height:1px;background:var(--border);margin:26px 0;}
  .feedback-box{
    background:var(--card);
    border:1px solid var(--border);
    border-left:3px solid var(--accent);
    border-radius:14px;
    padding:18px 20px;
    margin-bottom:14px;
  }
  .feedback-box.mistake{border-left-color:var(--bad);}
  .feedback-box.best{border-left-color:var(--good);}
  .feedback-box .tag{
    font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.6px;
    color:var(--text-2);margin-bottom:6px;
  }
  ul.lessons{margin:0;padding-left:18px;color:var(--text-1);}
  ul.lessons li{margin-bottom:8px;line-height:1.5;}

  .round-indicator{display:flex;gap:6px;margin-bottom:18px;}
  .round-dot{
    width:34px;height:6px;border-radius:4px;
    background:var(--border);
    transition:all .3s ease;
  }
  .round-dot.active{background:linear-gradient(90deg,var(--accent),var(--accent-2));}
  .round-dot.filled{background:rgba(91,140,255,0.45);}

  .ai-card{
    background:var(--card);border:1px solid var(--border);border-radius:16px;
    padding:18px;cursor:pointer;transition:all .22s ease;position:relative;
  }
  .ai-card:hover{transform:translateY(-2px);border-color:rgba(38,208,206,0.5);}
  .ai-card.selected{
    border-color:var(--teal);
    background:linear-gradient(180deg, rgba(38,208,206,0.12), rgba(38,208,206,0.04));
    box-shadow:0 0 0 1px rgba(38,208,206,0.5) inset;
  }
  .ai-icon{font-size:26px;margin-bottom:8px;}
  .impact-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;}
  .impact-tag{
    font-size:11px;padding:4px 8px;border-radius:8px;
    background:rgba(38,208,206,0.1);color:var(--teal);
    border:1px solid rgba(38,208,206,0.3);font-weight:600;
  }

  .footer-note{
    text-align:center;color:var(--text-2);font-size:12px;margin-top:30px;
  }
  .hint{
    font-size:12.5px;color:var(--text-2);margin-top:-8px;margin-bottom:18px;
  }
  .why-callout{
    background:rgba(124,92,255,0.08);
    border:1px solid rgba(124,92,255,0.28);
    border-radius:14px;
    padding:14px 16px;
    margin:16px 0 22px;
    font-size:13.5px;
    color:var(--text-1);
  }
  .why-callout b{color:var(--text-0);}

  @media(max-width:640px){
    .panel{padding:22px;}
    h1{font-size:26px;}
    .big-score{font-size:48px;}
  }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState } = React;

/* ============================= DATA ============================= */

const INDUSTRIES = ["Automotive Parts","Consumer Electronics","Pharmaceuticals","Apparel & Footwear","Food & Beverage","Home Appliances","Aerospace Components","Industrial Equipment"];
const COMPANY_PREFIX = ["Nova","Vertex","Orbit","Summit","Pioneer","Atlas","Meridian","Zenith","Falcon","Horizon","Titan","Quantum","Cobalt","Ironclad"];
const COMPANY_SUFFIX = ["Industries","Global","Dynamics","Manufacturing","Group","Holdings","Corp","Systems","Logistics","Works"];
const COUNTRIES_POOL = ["USA","Germany","China","Vietnam","Mexico","India","Brazil","Poland","Japan","South Korea","Thailand","Indonesia"];

function rand(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function randInt(min,max){ return Math.floor(Math.random()*(max-min+1))+min; }
function clamp(v,min,max){ return Math.max(min,Math.min(max,v)); }
function shuffle(arr){
  const a = [...arr];
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function generateCompany(){
  const industry = rand(INDUSTRIES);
  const name = `${rand(COMPANY_PREFIX)} ${rand(COMPANY_SUFFIX)}`;
  const revenue = "$" + randInt(120,980) + "M";
  const factories = randInt(2,12);
  const warehouses = randInt(3,20);
  const suppliers = randInt(15,120);
  const inventoryDays = randInt(10,60);
  const leadTime = randInt(15,90);
  const countries = shuffle(COUNTRIES_POOL).slice(0, randInt(3,5));
  return { industry, name, revenue, factories, warehouses, suppliers, inventoryDays, leadTime, countries };
}

const CRISIS_TYPES = [
  {
    id:"fire", title:"Factory Fire", icon:"🔥", urgency:"Critical",
    impact:{cost:-15, inventory:-25, profit:-10, delivery:-20, satisfaction:-10},
    describe:(c)=> `A fire broke out at one of ${c.name}'s primary manufacturing plants in ${rand(c.countries)}, halting production lines and destroying a portion of finished goods inventory.`,
    business:"Immediate output loss, insurance investigation likely, and downstream customers may face stockouts within days."
  },
  {
    id:"bankruptcy", title:"Supplier Bankruptcy", icon:"💸", urgency:"High",
    impact:{cost:-10, inventory:-15, profit:-15, delivery:-10, satisfaction:-5},
    describe:(c)=> `A tier-1 supplier providing critical components to ${c.name} has filed for bankruptcy, freezing shipments already in transit from ${rand(c.countries)}.`,
    business:"Component shortages could stall assembly lines within 2-3 weeks unless alternative sourcing is activated fast."
  },
  {
    id:"port", title:"Port Strike", icon:"⚓", urgency:"High",
    impact:{cost:-10, inventory:-10, profit:-5, delivery:-25, satisfaction:-15},
    describe:(c)=> `Dockworkers at a major port in ${rand(c.countries)} have gone on strike, backing up dozens of containers belonging to ${c.name}.`,
    business:"Inbound and outbound shipments are frozen; every day of delay compounds delivery backlogs."
  },
  {
    id:"cyber", title:"Cyberattack", icon:"🖥️", urgency:"Critical",
    impact:{cost:-20, inventory:-5, profit:-15, delivery:-10, satisfaction:-20},
    describe:(c)=> `${c.name}'s warehouse management and order systems were hit by ransomware, locking staff out of inventory and shipping data.`,
    business:"Order visibility is gone. Customers can't get accurate delivery updates, and recovery costs are mounting."
  },
  {
    id:"flood", title:"Flood", icon:"🌊", urgency:"High",
    impact:{cost:-15, inventory:-20, profit:-10, delivery:-15, satisfaction:-10},
    describe:(c)=> `Severe flooding has damaged a distribution warehouse for ${c.name} near ${rand(c.countries)}, soaking a large batch of stored inventory.`,
    business:"Warehouse capacity is temporarily offline and regional deliveries are at risk of major delay."
  },
  {
    id:"shortage", title:"Raw Material Shortage", icon:"⛏️", urgency:"Medium",
    impact:{cost:-15, inventory:-15, profit:-10, delivery:-10, satisfaction:-5},
    describe:(c)=> `A global shortage of a key raw material has spiked input prices for ${c.name}'s production in ${rand(c.countries)}.`,
    business:"Production costs are rising fast, and some product lines may need to slow output to conserve material."
  },
  {
    id:"political", title:"Political Conflict", icon:"🌍", urgency:"Critical",
    impact:{cost:-10, inventory:-10, profit:-10, delivery:-20, satisfaction:-10},
    describe:(c)=> `Escalating political unrest in ${rand(c.countries)} is disrupting border crossings and customs clearance for ${c.name}'s shipments.`,
    business:"Cross-border logistics are unpredictable, and diplomatic tension could last weeks or months."
  },
  {
    id:"shipdelay", title:"Shipping Delay", icon:"🚢", urgency:"Medium",
    impact:{cost:-5, inventory:-10, profit:-5, delivery:-20, satisfaction:-10},
    describe:(c)=> `A container backlog at sea has pushed back ${c.name}'s shipments from ${rand(c.countries)} by several weeks.`,
    business:"Retail and B2B customers are starting to ask for updated ETAs, and patience is running thin."
  }
];

const WAR_ROOM_ACTIONS = [
  {
    id:"air", title:"Air-Freight Emergency Stock",
    description:"Charter emergency air shipments to replace lost inventory fast.",
    why:"Why it matters: air freight is 4-6x more expensive than ocean freight, but it can restore product availability in days instead of weeks.",
    effects:{cost:-15, inventory:+20, profit:-10, delivery:+25, satisfaction:+15},
    quality:1
  },
  {
    id:"backup", title:"Activate Backup Supplier Network",
    description:"Shift orders to pre-vetted secondary suppliers in other regions.",
    why:"Why it matters: diversified sourcing is one of the highest-ROI resilience moves — it restores supply without the extreme cost of air freight.",
    effects:{cost:-5, inventory:+15, profit:-5, delivery:+15, satisfaction:+10},
    quality:3
  },
  {
    id:"ration", title:"Ration Inventory to Key Accounts",
    description:"Prioritize your highest-value customers with available stock.",
    why:"Why it matters: protects your most profitable relationships, but smaller customers may feel abandoned.",
    effects:{cost:+5, inventory:-10, profit:+5, delivery:-5, satisfaction:-5},
    quality:0
  },
  {
    id:"delay", title:"Delay Non-Critical Orders",
    description:"Push back lower-priority shipments to conserve resources.",
    why:"Why it matters: buys operational breathing room, but customer trust erodes quickly when delivery promises slip.",
    effects:{cost:+10, inventory:+5, profit:+5, delivery:-20, satisfaction:-15},
    quality:-2
  },
  {
    id:"priceup", title:"Raise Prices to Offset Losses",
    description:"Increase prices across affected product lines immediately.",
    why:"Why it matters: protects margin in the short term, but customers facing a crisis-driven price hike often remember it long after the crisis ends.",
    effects:{cost:0, inventory:0, profit:+20, delivery:0, satisfaction:-25},
    quality:-3
  },
  {
    id:"comm", title:"Transparent Customer Communication",
    description:"Proactively notify customers with honest timelines and updates.",
    why:"Why it matters: costs almost nothing but is consistently one of the strongest levers for preserving customer trust during a disruption.",
    effects:{cost:-2, inventory:0, profit:-2, delivery:0, satisfaction:+20},
    quality:2
  }
];

const NEGOTIATION_ROUNDS = [
  {
    title:"Round 1: Opening Stance",
    scenario:"You're on a call with your key supplier's VP of Sales to discuss terms during the crisis. How do you open?",
    choices:[
      {label:"Demand an immediate 20% discount, citing the crisis.", tone:"Aggressive", trust:-15, price:+20, leadTime:-5, quality:-1},
      {label:"Reference your long partnership and ask for fair, balanced terms.", tone:"Balanced", trust:+5, price:+10, leadTime:+5, quality:2},
      {label:"Accept their initial terms to keep the relationship smooth.", tone:"Accommodating", trust:+15, price:-10, leadTime:+10, quality:0}
    ]
  },
  {
    title:"Round 2: Volume Commitment",
    scenario:"The supplier hints that a longer-term commitment could unlock better pricing. Do you commit?",
    choices:[
      {label:"Offer a 2-year exclusive volume commitment for a lower price.", tone:"Strategic", trust:+15, price:+20, leadTime:+5, quality:2},
      {label:"Refuse to commit — keep your options open.", tone:"Cautious", trust:-5, price:-5, leadTime:0, quality:-1},
      {label:"Offer a smaller, 6-month partial commitment.", tone:"Moderate", trust:+5, price:+10, leadTime:+5, quality:1}
    ]
  },
  {
    title:"Round 3: The Lead-Time Crunch",
    scenario:"Your production is stalling and you need faster turnaround. How do you push for speed?",
    choices:[
      {label:"Pay a premium for expedited production.", tone:"Pragmatic", trust:+5, price:-15, leadTime:+25, quality:1},
      {label:"Pressure them with a threat to switch suppliers.", tone:"Coercive", trust:-20, price:+5, leadTime:+10, quality:-2},
      {label:"Propose joint production planning to solve it together.", tone:"Collaborative", trust:+20, price:+5, leadTime:+15, quality:3}
    ]
  },
  {
    title:"Round 4: Final Terms",
    scenario:"It's time to lock in the contract. What's your closing move?",
    choices:[
      {label:"Push hard for penalty clauses on late delivery.", tone:"Defensive", trust:-10, price:+5, leadTime:+10, quality:0},
      {label:"Sign a win-win contract with shared risk and reward.", tone:"Partnership", trust:+15, price:+10, leadTime:+10, quality:3},
      {label:"Walk away and search for a new supplier instead.", tone:"Risky", trust:-25, price:0, leadTime:-15, quality:-3}
    ]
  }
];

const BOARDROOM_QUESTIONS = [
  {
    question:"Your team is panicking as news of the crisis spreads internally. What's your first move as CEO?",
    options:[
      {text:"Call an all-hands emergency meeting to align everyone on facts.", points:20, quality:2},
      {text:"Delegate everything to the COO and stay hands-off.", points:5, quality:-2},
      {text:"Brief the board privately first, employees later.", points:10, quality:0},
      {text:"Make a public statement immediately, before you have full facts.", points:5, quality:-1}
    ]
  },
  {
    question:"A key customer threatens to cancel a major contract because of the disruption.",
    options:[
      {text:"Personally call the customer and offer a concrete recovery plan.", points:20, quality:2},
      {text:"Offer a steep discount without addressing the root cause.", points:8, quality:-1},
      {text:"Let the sales team handle it with no executive escalation.", points:5, quality:-2},
      {text:"Renegotiate contract terms transparently based on new realities.", points:15, quality:1}
    ]
  },
  {
    question:"Investors are asking how much financial exposure the crisis creates.",
    options:[
      {text:"Share a clear, honest range with a mitigation plan attached.", points:20, quality:2},
      {text:"Downplay the severity to avoid spooking the market.", points:5, quality:-2},
      {text:"Give vague reassurances without real numbers.", points:8, quality:-1},
      {text:"Provide detailed figures with confidence intervals and next steps.", points:15, quality:1}
    ]
  },
  {
    question:"Your operations staff are stretched thin working overtime through the crisis.",
    options:[
      {text:"Bring in temporary support and publicly recognize their effort.", points:20, quality:2},
      {text:"Push harder — deadlines don't move.", points:5, quality:-2},
      {text:"Offer flexible hours, but no extra staffing.", points:12, quality:0},
      {text:"Ignore morale concerns and focus only on output.", points:3, quality:-3}
    ]
  },
  {
    question:"Looking long-term, how do you prevent a crisis like this from recurring?",
    options:[
      {text:"Invest in supply chain visibility and supplier diversification.", points:20, quality:3},
      {text:"Hope it doesn't happen again.", points:2, quality:-3},
      {text:"Simply add more inventory buffer everywhere.", points:12, quality:0},
      {text:"Publicly blame the supplier for the disruption.", points:5, quality:-2}
    ]

function StepTrack({ screen }){
  const order = ["company","crisis","warroom","negotiation","boardroom","aistrategy","dashboard"];
  const idx = order.indexOf(screen);
  if(idx === -1) return null;
  return (
    <div className="step-track">
      {STEPS.map((s,i)=>(
        <div key={s} className={"step-pill " + (i===idx ? "active" : i<idx ? "done":"")}>
          {i<idx ? "✓ " : ""}{s}
        </div>
      ))}
    </div>
  );
}

function Bar({ label, value, colorOverride }){
  const v = clamp(Math.round(value),0,100);
  let color = colorOverride;
  if(!color){
    color = v>=65 ? "var(--good)" : v>=40 ? "var(--warn)" : "var(--bad)";
  }
  return (
    <div className="metric-block">
      <div className="metric-label"><span>{label}</span><span className="val">{v}/100</span></div>
      <div className="bar-track">
        <div className="bar-fill" style={{ width: v+"%", background: color }}></div>
      </div>
    </div>
  );
}

function App(){
  const [screen, setScreen] = useState("welcome");
  const [company, setCompany] = useState(null);
  const [crisis, setCrisis] = useState(null);
  const [metrics, setMetrics] = useState({cost:65,inventory:65,profit:65,delivery:65,satisfaction:65});
  const [selectedActions, setSelectedActions] = useState([]);
  const [warroomApplied, setWarroomApplied] = useState(false);
  const [negotiationState, setNegotiationState] = useState({round:0, trust:50, price:50, leadTime:50});
  const [boardroomIndex, setBoardroomIndex] = useState(0);
  const [boardroomScore, setBoardroomScore] = useState(0);
  const [aiSelected, setAiSelected] = useState([]);
  const [decisions, setDecisions] = useState([]);
  const [results, setResults] = useState(null);

  function resetAll(){
    setScreen("welcome");
    setCompany(null);
    setCrisis(null);
    setMetrics({cost:65,inventory:65,profit:65,delivery:65,satisfaction:65});
    setSelectedActions([]);
    setWarroomApplied(false);
    setNegotiationState({round:0, trust:50, price:50, leadTime:50});
    setBoardroomIndex(0);
    setBoardroomScore(0);
    setAiSelected([]);
    setDecisions([]);
    setResults(null);
  }

  function handleStart(){
    const c = generateCompany();
    const cr = rand(CRISIS_TYPES);
    setCompany(c);
    setCrisis(cr);
    setMetrics({
      cost: clamp(65 + cr.impact.cost, 0, 100),
      inventory: clamp(65 + cr.impact.inventory, 0, 100),
      profit: clamp(65 + cr.impact.profit, 0, 100),
      delivery: clamp(65 + cr.impact.delivery, 0, 100),
      satisfaction: clamp(65 + cr.impact.satisfaction, 0, 100)
    });
    setScreen("company");
  }

  function toggleAction(id){
    setSelectedActions(prev=>{
      if(prev.includes(id)) return prev.filter(x=>x!==id);
      if(prev.length>=3) return prev;
      return [...prev, id];
    });
  }

  function applyWarRoom(){
    let m = {...metrics};
    const chosenDecisions = [];
    selectedActions.forEach(id=>{
      const action = WAR_ROOM_ACTIONS.find(a=>a.id===id);
      m.cost = clamp(m.cost + action.effects.cost, 0, 100);
      m.inventory = clamp(m.inventory + action.effects.inventory, 0, 100);
      m.profit = clamp(m.profit + action.effects.profit, 0, 100);
      m.delivery = clamp(m.delivery + action.effects.delivery, 0, 100);
      m.satisfaction = clamp(m.satisfaction + action.effects.satisfaction, 0, 100);
      chosenDecisions.push({ text: `War Room: "${action.title}"`, quality: action.quality, phase:"War Room" });
    });
    setMetrics(m);
    setDecisions(prev=>[...prev, ...chosenDecisions]);
    setWarroomApplied(true);
  }

  function handleNegotiationChoice(choice){
    setNegotiationState(prev=>({
      round: prev.round+1,
      trust: clamp(prev.trust + choice.trust, 0, 100),
      price: clamp(prev.price + choice.price, 0, 100),
      leadTime: clamp(prev.leadTime + choice.leadTime, 0, 100)
    }));
    setDecisions(prev=>[...prev, { text: `Negotiation: "${choice.label}"`, quality: choice.quality, phase:"Negotiation" }]);
  }

  function handleBoardroomAnswer(option){
    setBoardroomScore(prev => prev + option.points);
    setDecisions(prev=>[...prev, { text: `Boardroom: "${option.text}"`, quality: option.quality, phase:"Boardroom" }]);
    setBoardroomIndex(prev=>prev+1);
  }

  function toggleAI(id){
    setAiSelected(prev=>{
      if(prev.includes(id)) return prev.filter(x=>x!==id);
      if(prev.length>=2) return prev;
      return [...prev, id];
    });
  }

  function finalizeStrategy(){
    let resilienceSum=0, costSum=0, riskSum=0, satSum=0;
    const aiDecisions = [];
    aiSelected.forEach(id=>{
      const inv = AI_INVESTMENTS.find(a=>a.id===id);
      resilienceSum += inv.resilience;
      costSum += inv.cost;
      riskSum += inv.risk;
      satSum += inv.satisfaction;
      const q = inv.id === "risk" ? 3 : 2;
      aiDecisions.push({ text: `AI Strategy: "${inv.title}"`, quality: q, phase:"AI Strategy" });
    });
    const allDecisions = [...decisions, ...aiDecisions];
    setDecisions(allDecisions);

    const leadershipScore = clamp(Math.round(boardroomScore),0,100);
    const negotiationScore = clamp(Math.round((negotiationState.trust + negotiationState.price + negotiationState.leadTime)/3),0,100);
    const resilienceScore = clamp(Math.round((metrics.inventory + metrics.delivery)/2 + resilienceSum), 0, 100);
    const costControlScore = clamp(Math.round((metrics.cost + metrics.profit)/2 + costSum), 0, 100);
    const riskManagementScore = clamp(Math.round((negotiationState.trust + riskSum*2 + leadershipScore)/3), 0, 100);
    const customerSatisfactionScore = clamp(Math.round(metrics.satisfaction + satSum + (negotiationState.trust-50)/5), 0, 100);

    const overall = clamp(Math.round(
      leadershipScore*0.20 +
      negotiationScore*0.15 +
      resilienceScore*0.20 +
      costControlScore*0.15 +
      riskManagementScore*0.15 +
      customerSatisfactionScore*0.15
    ), 0, 100);

    let feedbackTitle, feedbackText;
    if(overall>=85){
      feedbackTitle = "Outstanding Crisis Leadership";
      feedbackText = "You navigated the disruption with sharp judgment, protecting both the business and its relationships. This is boardroom-grade crisis management.";
    } else if(overall>=70){
      feedbackTitle = "Strong Crisis Management";
      feedbackText = "You made mostly sound calls under pressure, with a few trade-offs that cost you some ground. Solid, dependable leadership.";
    } else if(overall>=55){
      feedbackTitle = "Adequate, With Room to Grow";
      feedbackText = "You kept the business afloat, but several decisions leaned short-term. A few sharper trade-offs would meaningfully raise your resilience.";
    } else if(overall>=40){
      feedbackTitle = "Struggled Under Pressure";
      feedbackText = "The crisis exposed real gaps in your response. Cost, trust, or customer relationships took bigger hits than they needed to.";
    } else {
      feedbackTitle = "Crisis Mismanagement";
      feedbackText = "Several high-risk choices compounded the damage. This is a valuable lesson in how quickly short-term thinking can erode long-term trust.";
    }

    let mistakeText = "No major missteps — every decision was reasonably sound.";
    let bestText = "Every decision was roughly balanced.";
    if(allDecisions.length>0){
      const worst = allDecisions.reduce((a,b)=> b.quality < a.quality ? b : a);
      const bestD = allDecisions.reduce((a,b)=> b.quality > a.quality ? b : a);
      if(worst.quality < 0){
        mistakeText = `${worst.text} — this choice traded away long-term trust or resilience for a short-term gain.`;
      }
      if(bestD.quality > 0){
        bestText = `${bestD.text} — this decision balanced short-term needs with long-term relationship and resilience health.`;
      }
    }

    const recommendation = resilienceScore < 60
      ? "Prioritize supplier diversification and safety-stock buffers for your most fragile product lines before the next disruption hits."
      : riskManagementScore < 60
      ? "Formalize a supplier risk-monitoring process — most companies only build one after a crisis, not before."
      : "Keep investing in visibility tools and cross-functional crisis playbooks; your fundamentals are strong, so the next gain comes from speed of detection.";

    const lessons = [
      "Transparent communication is nearly always cheap relative to the trust it protects.",
      "Backup suppliers and diversified sourcing consistently outperform emergency air-freight as a long-term strategy.",
      "Negotiation leverage built on trust survives longer than leverage built on pressure.",
      "Short-term cost or profit gains that damage customer satisfaction often cost more later than they saved.",
      "AI-driven visibility (forecasting, risk monitoring) turns future crises from surprises into manageable events."
    ];

    setResults({
      overall,
      leadership: leadershipScore,
      negotiation: negotiationScore,
      resilience: resilienceScore,
      costControl: costControlScore,
      riskManagement: riskManagementScore,
      customerSatisfaction: customerSatisfactionScore,
      mistake: mistakeText,
      best: bestText,
      feedbackTitle,
      feedbackText,
      recommendation,
      lessons
    });
    setScreen("dashboard");
  }

  return (
    <div className="app-shell">
      <div className="topbar">
        <div className="brand"><span className="dot"></span> Operation Lifeline</div>
      </div>

      {screen === "welcome" && <Welcome onStart={handleStart} />}

      {screen === "company" && company && (
        <CompanyReveal company={company} onContinue={()=>setScreen("crisis")} />
      )}

      {screen === "crisis" && crisis && company && (
        <CrisisReveal crisis={crisis} company={company} onContinue={()=>setScreen("warroom")} />
      )}

      {screen === "warroom" && (
        <WarRoom
          metrics={metrics}
          selected={selectedActions}
          onToggle={toggleAction}
          applied={warroomApplied}
          onApply={applyWarRoom}
          onContinue={()=>setScreen("negotiation")}
        />
      )}

      {screen === "negotiation" && (
        <Negotiation
          state={negotiationState}
          onChoose={handleNegotiationChoice}
          onContinue={()=>setScreen("boardroom")}
        />
      )}

      {screen === "boardroom" && (
        <Boardroom
          index={boardroomIndex}
          onAnswer={handleBoardroomAnswer}
          score={boardroomScore}
          finished={boardroomIndex >= BOARDROOM_QUESTIONS.length}
          onContinue={()=>setScreen("aistrategy")}
        />
      )}

      {screen === "aistrategy" && (
        <AIStrategy
          selected={aiSelected}
          onToggle={toggleAI}
          onContinue={finalizeStrategy}
        />
      )}

      {screen === "dashboard" && results && (
        <Dashboard results={results} onReplay={resetAll} />
      )}

      <div className="footer-note">Operation Lifeline is a fictional training simulation. All companies, crises, and figures are randomly generated.</div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
