<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700"><rect width="1200" height="700" fill="#F6F8FB"/><rect x="40" y="40" width="1120" height="620" rx="20" fill="white" stroke="#D0D5DD"/><text x="70" y="95" font-family="Arial" font-size="34" font-weight="700" fill="#17365D">Revenue and Go-To-Market</text><text x="70" y="160" font-family="Arial" font-size="22" fill="#1F2937">Freemium: free diagnostic plus first roadmap.</text><text x="70" y="240" font-family="Arial" font-size="22" fill="#1F2937">Pricing: low-cost monthly and annual subscription, to be validated.</text><text x="70" y="320" font-family="Arial" font-size="22" fill="#1F2937">GTM: campus / creators / search -> assessment -> roadmap -> early win -> paid.</text><text x="70" y="400" font-family="Arial" font-size="22" fill="#1F2937">First 100: research -> pilot -> campus -> creator/referral.</text></svg>