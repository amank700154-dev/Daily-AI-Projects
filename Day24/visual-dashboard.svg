<rect x="70" y="130" width="600" height="180" rx="16" fill="#FFFFFF" stroke="#D0D5DD"/>
<text x="95" y="162" font-size="20" font-weight="700" fill="#2F5EAA">BUSINESS MODEL</text>
<text x="95" y="193" font-size="16" fill="#1F2937">Student pays for certainty:</text>
<text x="95" y="220" font-size="15" fill="#1F2937">Assess → Diagnose → Plan → Practice → Measure</text>
<text x="95" y="255" font-size="14" fill="#667085">Core value: prioritization + personalization + accountability</text>
<text x="95" y="280" font-size="14" fill="#667085">Not content volume; existing resources remain the supply layer.</text>

<rect x="700" y="130" width="630" height="180" rx="16" fill="#FFFFFF" stroke="#D0D5DD"/>
<text x="725" y="162" font-size="20" font-weight="700" fill="#2F5EAA">REVENUE</text>
<text x="725" y="198" font-size="16" fill="#1F2937">Free assessment + first roadmap</text>
<text x="725" y="225" font-size="16" fill="#1F2937">→ ₹199–₹299/month test</text>
<text x="725" y="252" font-size="16" fill="#1F2937">→ ₹999–₹1,999/year test</text>
<text x="725" y="282" font-size="14" fill="#667085">Pricing is a hypothesis until real payments validate it.</text>

<rect x="70" y="335" width="600" height="180" rx="16" fill="#FFFFFF" stroke="#D0D5DD"/>
<text x="95" y="367" font-size="20" font-weight="700" fill="#2F5EAA">GTM FLOW</text>
<text x="95" y="402" font-size="15" fill="#1F2937">Campus / clubs / creators / search</text>
<text x="95" y="432" font-size="15" fill="#1F2937">→ free assessment → roadmap → 3–7 day win → paid</text>
<text x="95" y="466" font-size="14" fill="#667085">Primary strategy: community-led distribution before paid ads.</text>
<text x="95" y="491" font-size="14" fill="#667085">North-star evidence: activated users and paid conversion.</text>

<rect x="700" y="335" width="630" height="180" rx="16" fill="#FFFFFF" stroke="#D0D5DD"/>
<text x="725" y="367" font-size="20" font-weight="700" fill="#2F5EAA">FIRST 100 USERS</text>
<text x="725" y="402" font-size="15" fill="#1F2937">10–15 research → 20–25 pilot → 25–30 campus</text>
<text x="725" y="432" font-size="15" fill="#1F2937">→ 20–25 creator/referral</text>
<text x="725" y="466" font-size="14" fill="#667085">Goal: discover a repeatable acquisition loop, not vanity signups.</text>
<text x="725" y="491" font-size="14" fill="#667085">Instrument activation, Day-7 return and payment.</text>

<rect x="70" y="540" width="600" height="180" rx="16" fill="#FFFFFF" stroke="#D0D5DD"/>
<text x="95" y="572" font-size="20" font-weight="700" fill="#2F5EAA">COMPETITIVE MOAT</text>
<text x="95" y="607" font-size="15" fill="#1F2937">Workflow quality → progress history</text>
<text x="95" y="637" font-size="15" fill="#1F2937">→ readiness calibration → outcome data + distribution</text>
<text x="95" y="671" font-size="14" fill="#667085">Weak today; must be earned through real user progress.</text>
<text x="95" y="696" font-size="14" fill="#667085">Do not try to moat the LLM itself.</text>

<rect x="700" y="540" width="630" height="180" rx="16" fill="#FFFFFF" stroke="#D0D5DD"/>
<text x="725" y="572" font-size="20" font-weight="700" fill="#2F5EAA">KEY RISKS</text>
<text x="725" y="607" font-size="15" fill="#C0392B">1. Free substitutes / AI commoditization</text>
<text x="725" y="635" font-size="15" fill="#C0392B">2. Weak retention</text>
<text x="725" y="663" font-size="15" fill="#C0392B">3. Willingness to pay</text>
<text x="725" y="691" font-size="15" fill="#C0392B">4. CAC / distribution repeatability</text>

<text x="70" y="765" font-size="22" font-weight="700" fill="#17365D">INVESTMENT SCORECARD</text>
