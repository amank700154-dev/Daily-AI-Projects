<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>🧩 Prompt Puzzle — Master AI Prompting Through Play</title>
<style>
:root{
  --bg:#070b16;
  --panel:#101729;
  --panel2:#151d32;
  --text:#eef3ff;
  --muted:#8995ad;
  --primary:#7c5cff;
  --secondary:#21d4fd;
  --good:#32d583;
  --bad:#ff5c7a;
  --warn:#ffbd4a;
  --border:rgba(255,255,255,.09);
  --shadow:0 20px 60px rgba(0,0,0,.35)
}
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  background:
    radial-gradient(circle at 10% 10%,rgba(124,92,255,.18),transparent 30%),
    radial-gradient(circle at 90% 20%,rgba(33,212,253,.12),transparent 25%),
    var(--bg);
  color:var(--text);
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif
}
button{font:inherit}
.app{max-width:1250px;margin:auto;padding:28px 20px 60px}
header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:20px;
  margin-bottom:22px
}
.logo{display:flex;gap:13px;align-items:center}
.logo-icon{font-size:38px;filter:drop-shadow(0 0 18px #7c5cff)}
.logo h1{margin:0;font-size:24px}
.logo p{margin:4px 0;color:var(--muted);font-size:13px}
.badge{
  padding:9px 14px;
  border:1px solid var(--border);
  border-radius:999px;
  background:rgba(255,255,255,.04);
  font-size:13px
}
.stats{
  display:grid;
  grid-template-columns:repeat(6,1fr);
  gap:10px;
  margin-bottom:18px
}
.stat{
  background:rgba(16,23,41,.82);
  border:1px solid var(--border);
  border-radius:15px;
  padding:13px;
  text-align:center;
  box-shadow:var(--shadow)
}
.stat b{display:block;font-size:20px}
.stat span{font-size:11px;color:var(--muted)}
.progress{
  height:7px;
  background:#1a2338;
  border-radius:20px;
  overflow:hidden;
  margin-bottom:22px
}
.progress i{
  display:block;
  height:100%;
  width:0;
  background:linear-gradient(90deg,var(--primary),var(--secondary));
  transition:.5s
}
.card{
  background:linear-gradient(145deg,rgba(16,23,41,.96),rgba(13,19,34,.94));
  border:1px solid var(--border);
  border-radius:24px;
  padding:26px;
  box-shadow:var(--shadow)
}
.topline{
  display:flex;
  justify-content:space-between;
  gap:15px;
  align-items:center;
  flex-wrap:wrap
}
.challenge{
  color:#b9aaff;
  font-size:12px;
  text-transform:uppercase;
  letter-spacing:1.5px;
  font-weight:800
}
h2{margin:8px 0 12px;font-size:27px}
.scenario{color:#ccd5e7;line-height:1.65;max-width:900px}
.goal{
  margin:18px 0;
  padding:15px;
  border-left:3px solid var(--secondary);
  background:rgba(33,212,253,.06);
  border-radius:10px
}
.goal strong{
  color:var(--secondary);
  display:block;
  margin-bottom:5px
}
.workspace{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:18px;
  margin-top:20px
}
.panel{
  background:rgba(255,255,255,.025);
  border:1px solid var(--border);
  border-radius:18px;
  padding:17px
}
.panel h3{margin:0 0 12px;font-size:14px}
.blocks{
  display:flex;
  flex-direction:column;
  gap:9px;
  min-height:120px
}
.block{
  padding:12px 13px;
  border:1px solid var(--border);
  border-radius:12px;
  background:#151e34;
  cursor:grab;
  transition:.18s;
  font-size:13px;
  line-height:1.4
}
.block:hover{
  transform:translateY(-2px);
  border-color:#7660e8;
  background:#1a2540
}
.block.correct{
  border-color:var(--good);
  background:rgba(50,213,131,.09)
}
.block.wrong{
  border-color:var(--bad);
  animation:shake .3s
}
@keyframes shake{
  25%{transform:translateX(-5px)}
  75%{transform:translateX(5px)}
}
.prompt-area{
  min-height:220px;
  border:1px dashed #53607a;
  border-radius:14px;
  padding:12px;
  display:flex;
  flex-direction:column;
  gap:8px;
  background:rgba(0,0,0,.12)
}
.prompt-area.over{
  border-color:var(--secondary);
  background:rgba(33,212,253,.06)
}
.empty{
  text-align:center;
  color:#65718a;
  font-size:13px;
  padding:45px 10px
}
.controls{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-top:16px
}
.btn{
  border:0;
  border-radius:12px;
  padding:11px 16px;
  color:white;
  background:#202b44;
  cursor:pointer;
  transition:.2s;
  font-weight:700
}
.btn:hover{
  transform:translateY(-2px);
  filter:brightness(1.12)
}
.btn.primary{background:linear-gradient(135deg,#7656ff,#5b42d9)}
.btn.good{background:#176c48}
.btn.warn{background:#76561b}
.btn.danger{background:#70223a}
.textbox{
  width:100%;
  min-height:190px;
  background:#0b1120;
  color:#eaf0ff;
  border:1px solid var(--border);
  border-radius:13px;
  padding:15px;
  resize:vertical;
  outline:none;
  line-height:1.55
}
.choice{
  padding:15px;
  border:1px solid var(--border);
  background:#121a2d;
  border-radius:14px;
  margin:9px 0;
  cursor:pointer;
  transition:.2s
}
.choice:hover{
  border-color:#8069ff;
  transform:translateX(3px)
}
.choice.selected{
  border-color:var(--secondary);
  background:rgba(33,212,253,.08)
}
.feedback{
  margin-top:15px;
  padding:13px;
  border-radius:12px;
  background:rgba(124,92,255,.08);
  border:1px solid var(--border);
  line-height:1.5
}
.output{
  margin-top:18px;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px
}
.output-card{
  padding:15px;
  background:#0c1323;
  border:1px solid var(--border);
  border-radius:15px
}
.output-card h4{margin:0 0 8px;color:#bcaeff}
.output-card p{
  color:#b6c0d4;
  font-size:13px;
  line-height:1.55;
  white-space:pre-wrap
}
.report{display:none}
.report.show{display:block}
.report-grid{
  display:grid;
  grid-template-columns:1.2fr 1fr;
  gap:18px
}
.big-score{
  font-size:65px;
  font-weight:900;
  background:linear-gradient(135deg,#fff,#8f7bff,#21d4fd);
  -webkit-background-clip:text;
  color:transparent
}
.rank{
  display:inline-block;
  padding:7px 13px;
  background:rgba(124,92,255,.15);
  border:1px solid rgba(124,92,255,.3);
  border-radius:999px;
  font-weight:800
}
.dna{
  display:flex;
  align-items:end;
  gap:7px;
  height:170px;
  padding:10px;
  background:#0b1120;
  border-radius:15px;
  border:1px solid var(--border)
}
.dna div{
  flex:1;
  border-radius:8px 8px 2px 2px;
  background:linear-gradient(to top,var(--primary),var(--secondary));
  min-height:12px;
  position:relative;
  transition:height .8s
}
.dna span{
  position:absolute;
  bottom:-22px;
  left:50%;
  transform:translateX(-50%);
  font-size:9px;
  color:var(--muted)
}
.final-prompt{
  background:#080d18;
  border:1px solid rgba(50,213,131,.3);
  border-radius:15px;
  padding:17px;
  white-space:pre-wrap;
  line-height:1.6;
  color:#dbe6f7
}
.toast{
  position:fixed;
  right:20px;
  bottom:20px;
  background:#151e34;
  border:1px solid var(--border);
  box-shadow:var(--shadow);
  padding:13px 17px;
  border-radius:12px;
  transform:translateY(120px);
  opacity:0;
  transition:.3s;
  z-index:10
}
.toast.show{
  transform:translateY(0);
  opacity:1
}
.hidden{display:none!important}
.timer{color:var(--secondary);font-weight:800}
@media(max-width:850px){
  .stats{grid-template-columns:repeat(3,1fr)}
  .workspace,.report-grid,.output{grid-template-columns:1fr}
}
@media(max-width:520px){
  .app{padding:18px 12px}
  header{align-items:flex-start}
  .stats{grid-template-columns:repeat(2,1fr)}
  .card{padding:18px}
  h2{font-size:22px}
}
</style>
</head>

<body>
<div class="app">

<header>
  <div class="logo">
    <div class="logo-icon">🧩</div>
    <div>
      <h1>Prompt Puzzle</h1>
      <p>Master AI Prompting Through Play</p>
    </div>
  </div>

  <div class="report-grid">

      <p id="feedback"></p>

    </div>

    <div class="panel">
      <h3>🧬 Prompt DNA</h3>
      <div class="dna" id="dna"></div>
    </div>
  </div>

  <div class="panel" style="margin-top:18px">
    <h3>✨ Final Optimized Prompt</h3>
    <div class="final-prompt" id="finalPrompt"></div>
  </div>

  <div class="controls">
    <button class="btn primary" onclick="restartGame()">🔄 Replay With New Scenarios</button>
  </div>
</section>

</div>

<div id="toast" class="toast"></div>

let hints=0;
let correctActions=0;
let totalActions=0;
let startTime=Date.now();
let timer=null;
let selectedChoice=null;
let placed=[];
let answered=false;

function shuffle(arr){
  return [...arr].sort(()=>Math.random()-.5);
}

function initGame(){
  scenarios=shuffle(scenarioBank).slice(0,7);
  current=0;
  score=0;
  moves=0;
  wrong=0;
  hints=0;
  correctActions=0;
  totalActions=0;
  startTime=Date.now();
  answered=false;
  clearInterval(timer);
  timer=setInterval(updateTime,1000);
  document.getElementById("report").classList.remove("show");
  document.getElementById("game").classList.remove("hidden");
  renderScenario();
  updateStats();
}

function updateTime(){
  const seconds=Math.floor((Date.now()-startTime)/1000);
  const m=String(Math.floor(seconds/60)).padStart(2,"0");
  const s=String(seconds%60).padStart(2,"0");
  document.getElementById("time").textContent=m+":"+s;
}

function updateStats(){
  document.getElementById("score").textContent=Math.max(0,score);
  const acc=totalActions?Math.round(correctActions/totalActions*100):100;
  document.getElementById("accuracy").textContent=acc+"%";
  document.getElementById("moves").textContent=moves;
  document.getElementById("wrong").textContent=wrong;
  document.getElementById("hints").textContent=hints;
  document.getElementById("progressBar").style.width=(current/scenarios.length*100)+"%";
}

function renderScenario(){
  const s=scenarios[current];
  answered=false;
  placed=[];
  selectedChoice=null;

  let html=`
  <section class="card">
    <div class="topline">
      <div>
        <div class="challenge">Challenge ${current+1} of ${scenarios.length} · ${s.domain}</div>
        <h2>${s.title}</h2>
      </div>
      <span class="badge">${challengeType()}</span>
    </div>

    <p class="scenario">${s.scenario}</p>

    <div class="goal">
      <strong>🎯 Desired Output</strong>
      ${s.desired}
    </div>
  `;

  if(challengeType()==="Build the Prompt"){
    html+=buildChallenge(s);
  }else if(challengeType()==="Clean the Prompt"){
    html+=cleanChallenge(s);
  }else{
    html+=chooseChallenge(s);
  }

  html+=`</section>`;
  document.getElementById("game").innerHTML=html;

  if(challengeType()==="Build the Prompt") setupDragDrop();
}

function challengeType(){
  const types=["Build the Prompt","Clean the Prompt","Choose the Best Prompt"];
  return types[current%3];
}

/* =========================================================
   CHALLENGE 1 — BUILD
========================================================= */

function buildChallenge(s){
  const all=shuffle([
    ...s.blocks.map((text,i)=>({text,correct:true,id:"c"+i})),
    ...s.distractors.map((text,i)=>({text,correct:false,id:"d"+i}))
  ]);

  return `
  <div class="workspace">
    <div class="panel">
      <h3>🧱 Available Prompt Blocks</h3>
      <div id="sourceBlocks" class="blocks">
        ${all.map(b=>`
          <div class="block" draggable="true"
               data-id="${b.id}" data-correct="${b.correct}">
               ${b.text}
          </div>`).join("")}
      </div>
    </div>

    <div class="panel">
      <h3>🧩 Build Your Prompt</h3>
      <div id="promptArea" class="prompt-area">
        <div class="empty" id="emptyPrompt">Drag the best blocks here...</div>
      </div>
    </div>
  </div>

  <div class="controls">
    <button class="btn warn" onclick="useHint()">💡 Hint</button>
    <button class="btn primary" onclick="checkBuild()">✓ Check Prompt</button>
  </div>

  <div id="feedback"></div>
  `;
}

function setupDragDrop(){
  const blocks=document.querySelectorAll(".block");
  const area=document.getElementById("promptArea");
  const source=document.getElementById("sourceBlocks");

  blocks.forEach(block=>{
    block.addEventListener("dragstart",e=>{
      e.dataTransfer.setData("text/plain",block.dataset.id);
    });

    block.addEventListener("dblclick",()=>{
      if(block.parentElement===source) addBlock(block);
      else source.appendChild(block);
    });
  });

  area.addEventListener("dragover",e=>{
    e.preventDefault();
    area.classList.add("over");
  });

  area.addEventListener("dragleave",()=>{
    area.classList.remove("over");
  });

  area.addEventListener("drop",e=>{
    e.preventDefault();
    area.classList.remove("over");
    const id=e.dataTransfer.getData("text/plain");
    const block=document.querySelector(`[data-id="${id}"]`);
    if(block) addBlock(block);
  });

  source.addEventListener("dragover",e=>e.preventDefault());

  source.addEventListener("drop",e=>{
    e.preventDefault();
    const id=e.dataTransfer.getData("text/plain");
    const block=document.querySelector(`[data-id="${id}"]`);
    if(block) source.appendChild(block);
  });
}

function addBlock(block){
  const area=document.getElementById("promptArea");
  const empty=document.getElementById("emptyPrompt");
  if(empty) empty.remove();

  area.appendChild(block);
  placed.push(block.dataset.id);
  moves++;
  totalActions++;
  updateStats();
}

function checkBuild(){
  if(answered)return;

  const area=document.getElementById("promptArea");
  const blocks=[...area.querySelectorAll(".block")];

  if(!blocks.length){
    showToast("Add some prompt blocks first.");
    return;
  }

  answered=true;

  let good=0;
  blocks.forEach(b=>{
    if(b.dataset.correct==="true"){
      b.classList.add("correct");
      good++;
    }else{
      b.classList.add("wrong");
      wrong++;
    }
  });

  correctActions+=good;
  totalActions+=s.blocks.length;

  const precision=good/blocks.length;
  const completeness=good/s.blocks.length;
  const bonus=Math.round(100*(precision*.55+completeness*.45));
  score+=Math.max(0,bonus-10);

  showFeedback(
    good===s.blocks.length && blocks.length===s.blocks.length,
    `${good}/${s.blocks.length} correct blocks selected. `+
    (good===s.blocks.length && blocks.length===s.blocks.length
      ?"Excellent prompt architecture! You included the useful constraints without distractors."
      :"Good attempt. A strong prompt needs the right role, audience/context, task, constraints, and output format.")
  );

  updateStats();
  setTimeout(nextScenario,1800);
}

/* =========================================================
   CHALLENGE 2 — CLEAN
========================================================= */

function cleanChallenge(s){
  return `
  <div class="panel" style="margin-top:20px">
    <h3>🧹 Weak Prompt</h3>
    <textarea id="cleanInput" class="textbox">${s.weak}</textarea>
    <div class="controls">
      <button class="btn warn" onclick="useHint()">💡 Hint</button>
      <button class="btn primary" onclick="checkClean()">✨ Optimize Prompt</button>
    </div>
    <div id="feedback"></div>
  </div>

  <div class="output">
    <div class="output-card">
      <h4>Weak AI Output</h4>
      <p>${s.weakOutput}</p>
    </div>
    <div class="output-card">
      <h4>Optimized AI Output</h4>
      <p>${s.optimizedOutput}</p>
    </div>
    <div class="output-card">
      <h4>Prompt Principle</h4>
      <p>${s.principle}</p>
    </div>
  </div>
  `;
}

function normalize(t){
  return t.toLowerCase()
    .replace(/[^\w\s]/g," ")
    .replace(/\s+/g," ")
    .trim();
}

function checkClean(){
  if(answered)return;
  answered=true;

  const input=normalize(document.getElementById("cleanInput").value);
  const target=normalize(scenarios[current].optimized);

  const keywords=[
    "act as",
    "target",
    "create",
    "provide",
    "return",
    "keep",
    "beginner",
    "practical",
    "explain",
    "format",
    "do not",
    "prioritize",
    "three"
  ];

  let hits=0;
  keywords.forEach(k=>{
    if(input.includes(k))hits++;
  });

  const targetWords=new Set(target.split(" "));
  const inputWords=new Set(input.split(" "));
  let overlap=0;
  targetWords.forEach(w=>{
    if(inputWords.has(w)&&w.length>3)overlap++;
  });

  const similarity=overlap/Math.max(1,targetWords.size);
  const quality=Math.min(100,Math.round(hits/8*55+similarity*45));

  totalActions++;
  if(quality>=70){
    correctActions++;
    score+=quality;
    showFeedback(true,`Optimization quality: ${quality}%. You added useful specificity and structure.`);
  }else{
    wrong++;
    score+=Math.max(10,quality);
    showFeedback(false,`Optimization quality: ${quality}%. Add role, context, exact task, constraints, and output format.`);
  }

  updateStats();
  setTimeout(nextScenario,2000);
}

/* =========================================================
   CHALLENGE 3 — CHOOSE
========================================================= */

function chooseChallenge(s){
  const options=shuffle([
    {text:s.weak,correct:false},
    {text:s.optimized,correct:true},
    {text:s.over,correct:false}
  ]);

  return `
  <div class="panel" style="margin-top:20px">
    <h3>🎯 Choose the Best Prompt</h3>
    ${options.map((o,i)=>`
      <div class="choice" data-correct="${o.correct}" onclick="selectChoice(this)">
        <strong>Option ${String.fromCharCode(65+i)}</strong>
        <div style="margin-top:7px">${o.text}</div>
      </div>
    `).join("")}
    <div class="controls">
      <button class="btn warn" onclick="useHint()">💡 Hint</button>
      <button class="btn primary" onclick="checkChoice()">Check Answer</button>
    </div>
    <div id="feedback"></div>
  </div>

  <div class="output">
    <div class="output-card">
      <h4>Prompt Principle</h4>
      <p>${s.principle}</p>
    </div>
    <div class="output-card">
      <h4>Weak AI Output</h4>
      <p>${s.weakOutput}</p>
    </div>
    <div class="output-card">
      <h4>Optimized AI Output</h4>
      <p>${s.optimizedOutput}</p>
    </div>
  </div>
  `;
}

function selectChoice(el){
  if(answered)return;
  document.querySelectorAll(".choice").forEach(x=>x.classList.remove("selected"));
  el.classList.add("selected");
  selectedChoice=el;
}

function checkChoice(){
  if(answered)return;

  if(!selectedChoice){
    showToast("Choose an option first.");
    return;
  }

  answered=true;
  totalActions++;

  if(selectedChoice.dataset.correct==="true"){
    selectedChoice.classList.add("correct");
    correctActions++;
    score+=120;
    showFeedback(true,"Correct! The optimized prompt is specific without becoming unnecessarily complicated.");
  }else{
    selectedChoice.classList.add("wrong");
    wrong++;
    score+=15;
    showFeedback(false,"Not quite. Avoid vague prompts and avoid adding unnecessary complexity.");
  }

  updateStats();
  setTimeout(nextScenario,1800);
}

/* =========================================================
   SUPPORT
========================================================= */

function showFeedback(good,text){
  const el=document.getElementById("feedback");
  if(!el)return;

  el.innerHTML=`
    <div class="feedback" style="border-color:${good?"rgba(50,213,131,.35)":"rgba(255,92,122,.35)"}">
      ${good?"✅":"⚠️"} ${text}
    </div>
  `;

  showToast(good?"Great move!":"Keep refining!");
}

function useHint(){
  if(answered)return;

  hints++;
  score=Math.max(0,score-20);

  const type=challengeType();
  let message="";

  if(type==="Build the Prompt"){
    message="Look for blocks covering role, context/audience, task, constraints, and output format.";
  }else if(type==="Clean the Prompt"){
    message="Add specificity: who the AI is, what it must do, who the output is for, constraints, and format.";
  }else{
    message="Choose the prompt that is specific and useful without being vague or unnecessarily complicated.";
  }

  showToast("💡 "+message);
  updateStats();
}

function nextScenario(){
  if(current<scenarios.length-1){
    current++;
    renderScenario();
    updateStats();
  }else{
    finishGame();
  }
}

function finishGame(){
  clearInterval(timer);
  document.getElementById("game").classList.add("hidden");
  document.getElementById("gameStats").style.display="none";
  document.querySelector(".progress").style.display="none";

  const seconds=Math.floor((Date.now()-startTime)/1000);
  const accuracy=totalActions?correctActions/totalActions:1;
  const timeBonus=Math.max(0,Math.round(300-seconds));
  const optimizationBonus=wrong===0?150:Math.max(0,150-wrong*20);

  const final=Math.max(
    0,
    Math.min(1000,
      score+
      Math.round(accuracy*250)+
      timeBonus+
      optimizationBonus-
      hints*20
    )
  );

  document.getElementById("report").classList.add("show");
  document.getElementById("finalScore").textContent=final;

  let rating,rank,milestone;

  if(final>=900){
    rating="🏆 Exceptional — you consistently build precise, efficient prompts.";
    rank="Prompt Architect";
    milestone="Teach the method to others or tackle expert-level multi-step prompts.";
  }else if(final>=750){
    rating="🔥 Excellent — your prompt structure is highly reliable.";
    rank="Prompt Strategist";
    milestone="Reduce unnecessary words while preserving important constraints.";
  }else if(final>=600){
    rating="⭐ Strong — you understand the core prompting patterns.";
    rank="Prompt Builder";
    milestone="Practice specifying output formats and evaluation criteria.";
  }else if(final>=450){
    rating="👍 Developing — your instincts are improving.";
    rank="Prompt Explorer";
    milestone="Focus on role + context + task + constraints + output format.";
  }else{
    rating="🌱 Beginner momentum — every round will make your prompts sharper.";
    rank="Prompt Apprentice";
    milestone="Start by replacing vague instructions with specific outcomes.";
  }

  document.getElementById("rating").textContent=rating;
  document.getElementById("rank").textContent=rank;
  document.getElementById("milestone").textContent=milestone;

  const feedback=`You completed ${scenarios.length} mixed-domain challenges with ${Math.round(accuracy*100)}% action accuracy. You made ${moves} moves, used ${hints} hints, and recorded ${wrong} wrong placements. Your strongest skill is recognizing that effective prompts balance specificity with simplicity.`;

  document.getElementById("feedback").textContent=feedback;

  const dnaValues=[
    Math.min(100,Math.round(accuracy*100)),
    Math.min(100,Math.round(score/7)),
    Math.max(10,100-wrong*12),
    Math.max(10,100-hints*15),
    Math.max(10,Math.round(100-Math.min(seconds,300)/3)),
    optimizationBonus/1.5
  ];

  const dnaLabels=["Accuracy","Structure","Precision","Hints","Speed","Optimization"];

  document.getElementById("dna").innerHTML=dnaValues.map((v,i)=>`
    <div style="height:${Math.max(12,Math.min(100,v))}%">
      <span>${dnaLabels[i]}</span>
    </div>
  `).join("");

  const best=scenarios.reduce((a,b)=>{
    return a.optimized.length<b.optimized.length?a:b;
  });

  document.getElementById("finalPrompt").textContent=best.optimized;
}

function restartGame(){
  document.getElementById("gameStats").style.display="grid";
  document.querySelector(".progress").style.display="block";
  initGame();
}

function showToast(text){
  const toast=document.getElementById("toast");
  toast.textContent=text;
  toast.classList.add("show");
  clearTimeout(window.toastTimer);
  window.toastTimer=setTimeout(()=>toast.classList.remove("show"),2200);
}

/* Start */
initGame();
</script>
</body>
</html>
