<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900"><rect width="1440" height="900" fill="#0b0b0d"/><text x="45" y="48" fill="#ff7a18" font-family="Arial" font-size="26" font-weight="700">MARKETING DETECTIVE</text><text x="45" y="125" fill="#f5f0e9" font-family="Arial" font-size="46" font-weight="800">Follow the Money. Follow the Attention.</text><text x="48" y="165" fill="#aaa3a0" font-family="Arial" font-size="17">Evidence Board • Luna Brew • 3/3 clues surfaced</text><rect x="45" y="205" width="1350" height="650" rx="12" fill="#59462f" stroke="#29201a" stroke-width="15"/><g font-family="Georgia" fill="#201a15"><g><rect x="85" y="255" width="370" height="195" fill="#eadbbd"/><circle cx="270" cy="246" r="9" fill="#ff7a18"/><text x="105" y="300" font-size="22" font-weight="700">CAMPAIGN BRIEF</text><text x="105" y="340" font-size="16">Audience: 18–28 urban students</text><text x="105" y="370" font-size="16">Instagram • TikTok • Email</text></g><g><rect x="515" y="255" width="370" height="195" fill="#eadbbd"/><circle cx="700" cy="246" r="9" fill="#ff7a18"/><text x="535" y="300" font-size="22" font-weight="700">BUDGET</text><text x="535" y="340" font-size="16">Paid Social  $18,000</text><text x="535" y="370" font-size="16">Creators  $9,000 • Email  $3,000</text></g><g><rect x="945" y="255" width="370" height="195" fill="#eadbbd"/><circle cx="1130" cy="246" r="9" fill="#ff7a18"/><text x="965" y="300" font-size="22" font-weight="700">METRICS</text><text x="965" y="340" font-size="16">Reach 1.84M • CTR 0.62%</text><text x="965" y="370" font-size="16">Engagement 7.8% • Sales $41,900</text></g><g><rect x="85" y="510" width="370" height="195" fill="#eadbbd"/><circle cx="270" cy="501" r="9" fill="#ff7a18"/><text x="105" y="555" font-size="22" font-weight="700">CUSTOMER VOICES</text><text x="105" y="595" font-size="15">“I cannot tell where to order.”</text><text x="105" y="625" font-size="15">“Product link was hard to find.”</text></g><g><rect x="515" y="510" width="370" height="195" fill="#eadbbd"/><circle cx="700" cy="501" r="9" fill="#ff7a18"/><text x="535" y="555" font-size="22" font-weight="700">SOCIAL TRACE</text><text x="535" y="595" font-size="15">Huge views and saves.</text><text x="535" y="625" font-size="15">Strong shares, weak product clicks.</text></g><g><rect x="945" y="510" width="370" height="195" fill="#eadbbd"/><circle cx="1130" cy="501" r="9" fill="#ff7a18"/><text x="965" y="555" font-size="22" font-weight="700">DRAG THE RED PIN</text><text x="965" y="595" font-size="15">Connect evidence to unlock</text><text x="965" y="625" font-size="15">the three supporting clues.</text></g></g></svg>