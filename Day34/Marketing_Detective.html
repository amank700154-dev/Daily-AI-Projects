<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marketing Detective</title>

<style>
:root{
  --accent:#ff7a18;
  --accent2:#ffb15c;
  --bg:#09090b;
  --panel:#151417;
  --panel2:#1d1b1e;
  --line:#343037;
  --text:#f5f1eb;
  --muted:#aaa3a0;
  --paper:#eadbbd;
  --ink:#241c16;
  --green:#5ee39b;
  --red:#ef6666;
}

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  min-height:100%;
  font-family:Inter,Arial,sans-serif;
  background:
    radial-gradient(circle at 10% 0,#ff7a1814,transparent 30%),
    var(--bg);
  color:var(--text);
}

body{
  overflow-x:hidden;
}

button{
  font:inherit;
  cursor:pointer;
}

button:hover{
  transform:translateY(-2px);
}

button:focus-visible{
  outline:2px solid var(--accent);
  outline-offset:3px;
}

.hidden{
  display:none!important;
}

.screen{
  min-height:100vh;
  padding:26px;
  animation:fadeIn .45s ease;
}

.wrap{
  max-width:1400px;
  margin:auto;
}

@keyframes fadeIn{
  from{
    opacity:0;
    transform:translateY(12px);
  }
  to{
    opacity:1;
    transform:none;
  }
}

@keyframes stamp{
  from{
    opacity:0;
    transform:scale(2.5) rotate(-14deg);
  }
  to{
    opacity:1;
    transform:scale(1) rotate(-7deg);
  }
}

@keyframes chartGrow{
  from{
    height:0;
  }
}

.primary{
  border:0;
  border-radius:11px;
  padding:14px 22px;
  font-weight:900;
  color:#17110d;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  box-shadow:0 10px 28px #0006;
}

.secondary{
  border:1px solid #403b41;
  background:#242125;
  color:#eee;
  border-radius:11px;
  padding:12px 18px;
}

.eyebrow{
  text-transform:uppercase;
  letter-spacing:3px;
  color:var(--accent2);
  font-size:11px;
  font-weight:900;
}

/* =========================
   THEME SCREEN
========================= */

.theme-screen{
  min-height:100vh;
  display:grid;
  place-items:center;
  padding:20px;
}

.theme-card{
  width:min(1000px,100%);
  padding:48px;
  text-align:center;
  border:1px solid #ffffff12;
  border-radius:28px;
  background:linear-gradient(145deg,#1b191c,#101012);
  box-shadow:0 35px 100px #000b;
}

.logo{
  width:78px;
  height:78px;
  margin:auto;
  display:grid;
  place-items:center;
  border-radius:22px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:#111;
  font-size:38px;
  box-shadow:0 0 40px #ff7a1845;
}

.theme-card h1{
  font-size:clamp(44px,7vw,78px);
  letter-spacing:-5px;
  margin:14px 0 10px;
}

.theme-card>p{
  max-width:720px;
  margin:0 auto 32px;
  color:var(--muted);
  line-height:1.75;
}

.themes{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:14px;
  margin-bottom:28px;
}

.theme-choice{
  text-align:left;
  color:#fff;
  background:#19181a;
  border:1px solid #fff1;
  border-radius:16px;
  padding:15px;
  transition:.2s;
}

.theme-choice.selected{
  border-color:var(--theme-color);
  box-shadow:
    0 0 0 2px var(--theme-color),
    0 0 25px #0005;
}

.swatch{
  height:48px;
  border-radius:11px;
  background:
    linear-gradient(
      135deg,
      var(--theme-color),
      var(--theme-color2)
    );
  margin-bottom:12px;
}

.theme-choice small{
  display:block;
  color:#888;
  margin-top:5px;
}

/* =========================
   HEADER
========================= */

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  margin-bottom:16px;
}

.brand{
  display:flex;
  align-items:center;
  gap:11px;
}

.brand-icon{
  width:43px;
  height:43px;
  border-radius:12px;
  background:var(--accent);
  color:#111;
  display:grid;
  place-items:center;
  font-size:22px;
}

.brand small{
  display:block;
  color:#777;
  margin-top:2px;
}

.progress{
  display:flex;
  gap:6px;
  margin-bottom:28px;
}

.progress-bar{
  height:5px;
  flex:1;
  border-radius:10px;
  background:#29272a;
}

.progress-bar.active{
  background:var(--accent);
  box-shadow:0 0 14px var(--accent);
}

/* =========================
   CASE ASSIGNMENT
========================= */

.assignment{
  max-width:1150px;
  margin:7vh auto 0;
  display:grid;
  grid-template-columns:1.2fr .8fr;
  gap:28px;
}

.folder{
  position:relative;
  padding:40px;
  border-radius:20px;
  border:1px solid #49413b;
  background:linear-gradient(145deg,#2a2525,#151315);
  box-shadow:0 28px 70px #0009;
}

.folder:after{
  content:"CLASSIFIED CASE FILE";
  position:absolute;
  right:24px;
  top:20px;
  font-size:9px;
  letter-spacing:2px;
  color:#777;
}

.company{
  font-size:23px;
  font-weight:900;
  color:var(--accent2);
}

.folder h2{
  font-size:clamp(40px,5vw,68px);
  letter-spacing:-4px;
  margin:10px 0 20px;
}

.meta{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}

.pill{
  border:1px solid #38343a;
  background:#0e0e10;
  border-radius:9px;
  padding:8px 11px;
  color:#c7c0bb;
  font-size:12px;
}

.brief{
  color:#aaa;
  line-height:1.75;
  margin:22px 0 28px;
}

.photo{
  align-self:center;
  background:var(--paper);
  color:var(--ink);
  padding:18px 18px 30px;
  transform:rotate(2deg);
  box-shadow:0 22px 45px #0008;
}

.fake-photo{
  height:310px;
  display:grid;
  place-items:center;
  font-size:80px;
  background:
    linear-gradient(135deg,#5c4b3caa,#2e2823aa),
    repeating-linear-gradient(
      45deg,
      #43392f 0 5px,
      #594a3c 5px 12px
    );
}

.photo p{
  font-family:Georgia,serif;
  font-weight:bold;
  margin:14px 3px 0;
}

/* =========================
   INVESTIGATION BOARD
========================= */

.board{
  min-height:650px;
  padding:34px;
  border:14px solid #2b211a;
  border-radius:10px;
  background:#59462f;
  box-shadow:
    inset 0 0 100px #0008,
    0 25px 70px #0009;
  position:relative;
  overflow:hidden;
}

.board:before{
  content:"";
  position:absolute;
  inset:0;
  opacity:.13;
  pointer-events:none;
  background:
    repeating-linear-gradient(
      0deg,
      transparent 0 5px,
      #1f150e 6px
    ),
    repeating-linear-gradient(
      90deg,
      transparent 0 12px,
      #fff 13px
    );
}

.board-head{
  position:relative;
  display:flex;
  justify-content:space-between;
  align-items:end;
  margin-bottom:25px;
}

.board-head h2{
  font:700 35px Georgia,serif;
  color:#f0dfbf;
  margin:4px 0;
}

.board-head p{
  color:#c8b89e;
  font-size:13px;
  margin:0;
}

.evidence{
  position:relative;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:20px;
}

.note{
  position:relative;
  min-height:185px;
  padding:24px 20px;
  background:var(--paper);
  color:var(--ink);
  box-shadow:0 15px 28px #0007;
  transition:.2s;
  user-select:none;
}

.note:nth-child(2){
  transform:rotate(-1.5deg);
}

.note:nth-child(3){
  transform:rotate(1.2deg);
}

.note:nth-child(4){
  transform:rotate(-2deg);
}

.note:nth-child(5){
  transform:rotate(1deg);
}

.note:nth-child(6){
  transform:rotate(-1deg);
}

.note:hover{
  transform:translateY(-7px) rotate(0);
  box-shadow:0 22px 38px #0008;
}

.note h3{
  font-family:Georgia,serif;
  margin:0 0 10px;
}

.note p{
  font:14px/1.55 Georgia,serif;
}

.pin{
  position:absolute;
  top:-9px;
  left:50%;
  width:18px;
  height:18px;
  border-radius:50%;
  background:var(--accent);
  box-shadow:0 3px 5px #0009;
}

.tag{
  display:inline-block;
  padding:5px 8px;
  border-radius:5px;
  background:#211a14;
  color:#f3c790;
  font-size:9px;
  font-weight:900;
  letter-spacing:1px;
}

.board-bottom{
  position:relative;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  margin-top:25px;
}

.dropzone{
  min-width:280px;
  padding:18px;
  text-align:center;
  color:#ead3a7;
  border:2px dashed #e7c89c88;
  border-radius:12px;
  background:#0002;
}

.hint{
  color:#d2c2a8;
  font-size:13px;
}

.draggable{
  cursor:grab;
}

/* =========================
   INVESTIGATION
========================= */

.investigation{
  max-width:1150px;
  margin:auto;
}

.case-panel{
  padding:30px;
  border-radius:20px;
  background:linear-gradient(145deg,#19171a,#111012);
  border:1px solid #302d32;
  box-shadow:0 22px 65px #0008;
}

.case-panel h2{
  font-size:42px;
  letter-spacing:-2px;
  margin:8px 0;
}

.sub{
  color:var(--accent2);
}

.clue-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:16px;
  margin:25px 0;
}

.clue{
  background:#201e20;
  border:1px solid #38343a;
  border-radius:14px;
  padding:18px;
  transition:.3s;
}

.clue.locked{
  filter:blur(3px);
  opacity:.48;
}

.clue.unlocked{
  border-color:var(--accent);
  box-shadow:0 0 25px #ff7a1815;
}

.clue h3{
  font-size:13px;
}

.clue p{
  font-size:13px;
  line-height:1.6;
  color:#aaa;
}

.choices{
  display:grid;
  gap:12px;
  margin:25px 0;
}

.choice{
  text-align:left;
  color:#eee;
  padding:17px;
  border-radius:12px;
  background:#201e20;
  border:1px solid #373339;
  transition:.2s;
}

.choice.correct{
  background:#123021;
  border-color:var(--green);
}

.choice.wrong{
  background:#321818;
  border-color:var(--red);
}

.feedback{
  padding:19px;
  border-radius:12px;
  background:#151417;
  border:1px solid #333;
  color:#aaa;
  line-height:1.65;
}

.actions{
  display:flex;
  gap:10px;
  justify-content:flex-end;
}

/* =========================
   CASE CLOSED
========================= */

.close-overlay{
  position:fixed;
  inset:0;
  z-index:50;
  display:grid;
  place-items:center;
  text-align:center;
  background:#050505f5;
}

.stamp{
  color:var(--accent);
  border:8px solid var(--accent);
  padding:15px 28px;
  font:900 clamp(48px,10vw,130px) Georgia,serif;
  transform:rotate(-7deg);
  animation:stamp .7s cubic-bezier(.2,.8,.2,1);
}

.close-overlay p{
  color:#aaa;
  margin-top:28px;
}

/* =========================
   LEARNING REPORT
========================= */

.report{
  max-width:1200px;
  margin:auto;
}

.report-head{
  padding:35px;
  border-radius:20px;
  background:linear-gradient(135deg,#211e20,#121113);
  border:1px solid #373238;
}

.report-head h2{
  font-size:clamp(38px,5vw,58px);
  letter-spacing:-3px;
  margin:8px 0;
}

.score{
  font-size:62px;
  font-weight:900;
  color:var(--accent2);
}

.report-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:18px;
  margin-top:18px;
}

.report-card{
  background:#181619;
  border:1px solid #302c31;
  border-radius:16px;
  padding:23px;
}

.report-card p,
.report-card li{
  color:#aaa;
  line-height:1.65;
}

.metric{
  margin:15px 0;
}

.metric-top{
  display:flex;
  justify-content:space-between;
  font-size:12px;
  color:#aaa;
}

.track{
  height:8px;
  background:#29272a;
  border-radius:10px;
  overflow:hidden;
  margin-top:6px;
}

.fill{
  height:100%;
  width:0;
  background:linear-gradient(
    90deg,
    var(--accent),
    var(--accent2)
  );
  transition:width 1.2s ease;
}

.chart{
  height:205px;
  display:flex;
  align-items:end;
  gap:10px;
  border-bottom:1px solid #39353a;
  padding:10px;
}

.chart-column{
  flex:1;
  height:100%;
  display:flex;
  flex-direction:column;
  justify-content:end;
}

.chart-bar{
  width:100%;
  border-radius:5px 5px 0 0;
  background:linear-gradient(
    var(--accent2),
    var(--accent)
  );
  animation:chartGrow 1s ease;
}

.chart-label{
  text-align:center;
  color:#777;
  font-size:10px;
  margin-top:6px;
}

.tip{
  border-left:3px solid var(--accent);
  padding-left:14px;
}

.footer-actions{
  display:flex;
  gap:10px;
  margin-top:22px;
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:850px){

  .themes{
    grid-template-columns:repeat(2,1fr);
  }

  .assignment{
    grid-template-columns:1fr;
  }

  .photo{
    width:min(500px,100%);
    margin:auto;
  }

  .evidence,
  .clue-grid,
  .report-grid{
    grid-template-columns:1fr;
  }

  .board{
    padding:25px 16px;
  }

  .board-head{
    display:block;
  }

  .board-bottom{
    flex-direction:column;
    align-items:stretch;
  }

  .dropzone{
    min-width:0;
  }
}

@media(max-width:520px){

  .screen{
    padding:15px;
  }

  .theme-card{
    padding:30px 20px;
  }

  .theme-card h1{
    letter-spacing:-3px;
  }

  .themes{
    grid-template-columns:1fr 1fr;
  }

  .folder{
    padding:28px 22px;
  }

  .folder h2{
    font-size:43px;
  }

  .top .secondary{
    padding:9px;
  }
}
</style>
</head>

<body>

<div id="app"></div>

<script>
"use strict";

/* =========================================================
   THEMES
========================================================= */

const themes = [
  {
    name:"Claude Orange",
    accent:"#ff7a18",
    accent2:"#ffb15c"
  },
  {
    name:"Neon Noir",
    accent:"#00e5ff",
    accent2:"#8a7cff"
  },
  {
    name:"Emerald Case",
    accent:"#43d17b",
    accent2:"#b2f7c8"
  },
  {
    name:"Crimson File",
    accent:"#f04462",
    accent2:"#ff9a7a"
  }
];

/* =========================================================
   10 FICTIONAL MARKETING CASES
========================================================= */

const cases = [

{
  company:"Luna Brew",
  industry:"Specialty Coffee",
  objective:"Increase online orders for a new cold-brew range.",
  audience:"18–28 year-old urban students and first-job professionals.",
  channels:["Instagram","TikTok","Email"],
  budget:{
    "Paid Social":"$18,000",
    "Creators":"$9,000",
    "Email":"$3,000"
  },
  metrics:{
    reach:"1.84M",
    ctr:"0.62%",
    engagement:"7.8%",
    conversions:"1,126",
    sales:"$41,900"
  },
  comments:[
    "The videos look amazing, but I cannot tell where to order.",
    "Loved the recipe content. The product link was hard to find.",
    "I thought this was a coffee tutorial, not an ad."
  ],
  social:"Short-form videos generated huge views and saves. Creator posts were widely shared, but product clicks stayed weak.",
  mistake:"The campaign optimized for entertainment rather than a clear purchase path.",
  clues:[
    "CTR is far below the engagement rate despite strong reach.",
    "Customers repeatedly mention difficulty finding the order link.",
    "Creator videos received strong saves and shares but weak conversion activity."
  ],
  explanation:"Luna Brew built attention without connecting attention to action. The creative was successful as content but failed as a conversion journey.",
  improvements:[
    "Use a single obvious CTA in every creative.",
    "Build landing pages matching each creator's promise.",
    "Retarget video viewers with product-led ads and limited offers."
  ]
},

{
  company:"Northstar Bikes",
  industry:"Urban Mobility",
  objective:"Generate qualified leads for premium commuter bicycles.",
  audience:"25–45 year-old city commuters with mid-to-high disposable income.",
  channels:["Google Search","LinkedIn","Outdoor"],
  budget:{
    "Search":"$22,000",
    "LinkedIn":"$16,000",
    "Outdoor":"$12,000"
  },
  metrics:{
    reach:"680K",
    ctr:"4.9%",
    engagement:"3.1%",
    conversions:"184",
    sales:"$112,400"
  },
  comments:[
    "I wanted to compare models but the page only showed one bike.",
    "The ad promised a test ride, but I had to hunt for the form.",
    "Great product, confusing website."
  ],
  social:"LinkedIn posts earned moderate engagement while search ads produced the highest-intent traffic.",
  mistake:"The campaign sent every audience segment to the same generic landing page.",
  clues:[
    "Search CTR is strong, showing high intent.",
    "Customers complain about missing comparison and test-ride paths.",
    "Search generated most conversions while broad channels underperformed."
  ],
  explanation:"Northstar had good demand capture but poor message-to-page matching. Different intents needed different landing experiences.",
  improvements:[
    "Create model-specific landing pages.",
    "Match ads to test-ride, comparison, and pricing intents.",
    "Shift budget toward high-intent search terms."
  ]
},

{
  company:"Mira Skin",
  industry:"Beauty",
  objective:"Launch a sensitive-skin moisturizer.",
  audience:"20–35 year-old consumers researching gentle skincare.",
  channels:["Instagram","YouTube","Micro-influencers"],
  budget:{
    "Creators":"$20,000",
    "Video":"$14,000",
    "Paid":"$6,000"
  },
  metrics:{
    reach:"2.7M",
    ctr:"1.8%",
    engagement:"9.6%",
    conversions:"392",
    sales:"$28,700"
  },
  comments:[
    "Every creator says it works instantly. That feels exaggerated.",
    "I wanted ingredient details before buying.",
    "The comments had questions but nobody answered them."
  ],
  social:"Influencer content drove exceptional comments and saves, especially around before/after claims.",
  mistake:"Mira Skin treated influencer reach as the end goal and failed to manage purchase objections.",
  clues:[
    "Comment volume is high but many comments are unanswered questions.",
    "Customers request ingredient and proof information.",
    "Conversions are low relative to creator engagement."
  ],
  explanation:"The campaign created curiosity but left trust gaps unresolved. High engagement became a queue of unanswered buying objections.",
  improvements:[
    "Add ingredient explainers and evidence-based product pages.",
    "Create a rapid response process for social questions.",
    "Replace exaggerated claims with credible demonstrations."
  ]
},

{
  company:"PixelForge Academy",
  industry:"Online Education",
  objective:"Increase enrollments for a six-week web development bootcamp.",
  audience:"College students and early-career professionals seeking technical skills.",
  channels:["YouTube","Search","Email"],
  budget:{
    "YouTube":"$25,000",
    "Search":"$15,000",
    "Email":"$5,000"
  },
  metrics:{
    reach:"1.2M",
    ctr:"3.4%",
    engagement:"5.2%",
    conversions:"74",
    sales:"$52,800"
  },
  comments:[
    "I liked the videos but I don't know what happens after I sign up.",
    "The course sounds good but there are too many choices.",
    "I need proof that students actually get jobs."
  ],
  social:"Educational videos performed well, but the enrollment page had several competing calls to action.",
  mistake:"The enrollment experience created decision overload instead of one confident next step.",
  clues:[
    "Video engagement is healthy while enrollment remains low.",
    "Visitors are asking basic questions that the landing page should answer.",
    "Multiple CTAs compete above the fold."
  ],
  explanation:"PixelForge successfully generated interest but created friction at the most important moment: choosing to enroll.",
  improvements:[
    "Reduce the landing page to one primary CTA.",
    "Add outcomes, testimonials and curriculum clarity.",
    "Use FAQ content before the enrollment decision."
  ]
},

{
  company:"GreenCart",
  industry:"Grocery Delivery",
  objective:"Acquire new customers in three metropolitan areas.",
  audience:"Busy professionals and families interested in convenient grocery delivery.",
  channels:["Facebook","Google","Referral"],
  budget:{
    "Facebook":"$30,000",
    "Google":"$25,000",
    "Referral":"$10,000"
  },
  metrics:{
    reach:"3.4M",
    ctr:"2.2%",
    engagement:"4.1%",
    conversions:"2,840",
    sales:"$74,600"
  },
  comments:[
    "The discount was good, but delivery fees surprised me.",
    "I only noticed the delivery charge at checkout.",
    "The ad made the first order look cheaper than it was."
  ],
  social:"The acquisition campaign received strong clicks, but negative comments focused on unexpected delivery fees.",
  mistake:"The campaign hid an important cost until late in the customer journey.",
  clues:[
    "Clicks are healthy but customer sentiment is increasingly negative.",
    "Multiple comments mention unexpected fees.",
    "Checkout abandonment is concentrated after delivery charges appear."
  ],
  explanation:"GreenCart's acquisition message created a pricing expectation that the checkout experience broke. The campaign was optimized for clicks instead of qualified customers.",
  improvements:[
    "Show total estimated cost earlier.",
    "Make promotional terms explicit in ads.",
    "Optimize toward completed first orders rather than clicks."
  ]
},

{
  company:"VoltRun",
  industry:"Fitness Technology",
  objective:"Sell a new smart running watch.",
  audience:"Recreational runners aged 20–40.",
  channels:["Instagram","Search","Affiliate"],

/* =========================================================

========================================================= */

let state={

  evidenceCount:0,

/* =========================================================
   HELPERS
========================================================= */

function esc(value){
  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function randomCase(){
  return cases[Math.floor(Math.random()*cases.length)];
}

function applyTheme(){
  const theme=themes[state.theme];

  document.documentElement.style.setProperty(
    "--accent",
    theme.accent
  );

  document.documentElement.style.setProperty(
    "--accent2",
    theme.accent2
  );
}

function header(step){
  const steps=[
    "Case Assignment",
    "Investigation Board",
    "Solve the Case",
    "Learning Report"
  ];

  return `
    <div class="top">
      <div class="brand">
        <div class="brand-icon">🔎</div>
        <div>
          <strong>MARKETING DETECTIVE</strong>
          <small>${steps[step-1] || ""}</small>
        </div>
      </div>

      <button
        class="secondary"
        onclick="restartTheme()">
        Change Theme
      </button>
    </div>

    <div class="progress">
      ${[1,2,3,4].map(
        n=>`
          <div class="progress-bar ${
            n<=step ? "active" : ""
          }"></div>
        `
      ).join("")}
    </div>
  `;
}

/* =========================================================
   INTERACTION
========================================================= */

function selectTheme(index){
  state.theme=index;
  applyTheme();
  renderTheme();
}

function startCase(){

  let next=randomCase();

  /*
    Avoid immediately showing exactly the same
    case during replay whenever possible.
  */
  if(
    state.currentCase &&
    cases.length>1
  ){
    while(next===state.currentCase){
      next=randomCase();
    }
  }

  state.currentCase=next;
  state.evidenceCount=0;
  state.selectedAnswer=null;
  state.solved=false;
  state.score=0;
  state.screen="assignment";

  renderAssignment();
}

function openBoard(){
  state.screen="board";
  renderBoard();
}

function allowDrop(event){
  event.preventDefault();
}

function dragEvidence(event){
  event.dataTransfer.setData(
    "text/plain",
    "evidence"
  );
}

function dropEvidence(event){

  event.preventDefault();

  if(state.evidenceCount<3){
    state.evidenceCount++;
  }

  renderBoard();
}

function solveCase(){

  if(state.evidenceCount<3){
    return;
  }

  state.screen="solve";
  renderSolve();
}

function chooseAnswer(index){

  state.selectedAnswer=index;

  renderSolve();
}

function restartTheme(){
  state.screen="theme";
  renderTheme();
}

/* =========================================================
   INITIALIZE
========================================================= */

applyTheme();

const app=document.getElementById("app");
