<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Marketing Detective</title>
<style>
:root{--a:#ff7a18;--a2:#ffb15c;--bg:#0b0b0d;--panel:#171518;--line:#343036;--muted:#aaa3a0;--paper:#eadbbd;--ink:#201a15;--green:#5ee39b;--red:#ed6969}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:radial-gradient(circle at 15% 0,#ff7a1810,transparent 30%),#0b0b0d;color:#f5f0e9}button{font:inherit;cursor:pointer}button:focus-visible{outline:2px solid var(--a);outline-offset:3px}.hidden{display:none!important}.screen{min-height:100vh;padding:28px;animation:in .45s ease}@keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}.wrap{max-width:1400px;margin:auto}
.theme{min-height:100vh;display:grid;place-items:center;padding:22px}.themeCard{width:min(980px,100%);padding:46px;background:linear-gradient(145deg,#1b191c,#111114);border:1px solid #ffffff12;border-radius:28px;box-shadow:0 30px 80px #0009;text-align:center}.logo{width:76px;height:76px;margin:auto;border-radius:21px;display:grid;place-items:center;background:linear-gradient(135deg,var(--a),var(--a2));color:#111;font-size:39px;box-shadow:0 0 40px #ff7a1840}.eyebrow{text-transform:uppercase;letter-spacing:3px;font-size:11px;font-weight:900;color:var(--a2)}h1{font-size:clamp(43px,7vw,78px);letter-spacing:-4px;margin:12px 0}.themeCard>p{color:var(--muted);line-height:1.7;max-width:700px;margin:0 auto 30px}.themes{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:28px}.themePick{background:#19181a;border:1px solid #fff1;border-radius:16px;padding:16px;color:#fff;text-align:left;transition:.2s}.themePick:hover{transform:translateY(-3px)}.themePick.selected{border-color:var(--c);box-shadow:0 0 0 2px var(--c)}.swatch{height:42px;border-radius:11px;background:linear-gradient(135deg,var(--c),#fff4);margin-bottom:12px}.themePick small{display:block;color:#999;margin-top:4px}.primary{border:0;border-radius:11px;padding:14px 23px;font-weight:900;color:#17120d;background:linear-gradient(135deg,var(--a),var(--a2));box-shadow:0 10px 25px #ff7a1825}.secondary{border:1px solid #3b373b;background:#242225;color:#eee;border-radius:11px;padding:12px 18px}.primary:hover,.secondary:hover{transform:translateY(-2px)}
.top{display:flex;justify-content:space-between;align-items:center;gap:15px;max-width:1400px;margin:auto 0 20px}.brand{display:flex;gap:11px;align-items:center}.brandIcon{width:42px;height:42px;border-radius:11px;background:var(--a);color:#111;display:grid;place-items:center;font-size:21px}.brand strong{display:block}.brand small{color:#777}.progress{display:flex;gap:6px;max-width:1400px;margin:0 auto 28px}.bar{height:5px;background:#29272a;border-radius:10px;flex:1;overflow:hidden}.bar.on{background:var(--a);box-shadow:0 0 14px var(--a)}
.assignment{max-width:1150px;margin:7vh auto 0;display:grid;grid-template-columns:1.2fr .8fr;gap:28px}.folder{position:relative;padding:38px;border:1px solid #443d38;border-radius:20px;background:linear-gradient(145deg,#292424,#161416);box-shadow:0 25px 60px #0008}.folder:after{content:"CASE FILE";position:absolute;right:24px;top:20px;font-size:10px;letter-spacing:2px;color:#777}.company{color:var(--a2);font-size:22px;font-weight:900}.folder h2{font-size:clamp(35px,5vw,64px);letter-spacing:-3px;margin:10px 0 18px}.meta{display:flex;flex-wrap:wrap;gap:8px}.pill{padding:8px 11px;border:1px solid #38343a;border-radius:9px;background:#0d0d0f;color:#c7c0bb;font-size:12px}.brief{color:#aaa;line-height:1.75;margin:22px 0 28px}.photo{background:var(--paper);color:var(--ink);padding:18px 18px 30px;transform:rotate(2deg);box-shadow:0 20px 45px #0008;align-self:center}.fake{height:300px;background:repeating-linear-gradient(135deg,#443a31 0 4px,#5b4d3f 4px 10px);display:grid;place-items:center;font-size:72px;color:#d6c3a3}.photo p{font-family:Georgia,serif;font-weight:bold;margin:14px 4px 0}
.board{max-width:1400px;margin:auto;min-height:650px;padding:34px;background:#59462f;border:14px solid #29201a;border-radius:9px;box-shadow:inset 0 0 90px #0006,0 25px 70px #0008;position:relative;overflow:hidden}.board:before{content:"";position:absolute;inset:0;opacity:.14;background:repeating-linear-gradient(0deg,transparent 0 5px,#21170f 6px),repeating-linear-gradient(90deg,transparent 0 12px,#fff 13px);pointer-events:none}.boardTitle,.evidence{position:relative}.boardTitle{display:flex;justify-content:space-between;align-items:end;margin-bottom:25px}.boardTitle h2{font:700 34px Georgia,serif;margin:0;color:#f0dfbf}.boardTitle p{margin:5px 0 0;color:#c8b89e;font-size:13px}.evidence{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.note{position:relative;background:var(--paper);color:var(--ink);padding:24px 20px;min-height:180px;box-shadow:0 14px 25px #0006;transition:.2s;user-select:none}.note:nth-child(2){transform:rotate(-1.5deg)}.note:nth-child(3){transform:rotate(1.2deg)}.note:nth-child(4){transform:rotate(-2deg)}.note:nth-child(5){transform:rotate(1deg)}.note:nth-child(6){transform:rotate(-1deg)}.note:hover{transform:translateY(-7px) rotate(0);box-shadow:0 20px 35px #0008}.pin{position:absolute;top:-9px;left:50%;width:17px;height:17px;border-radius:50%;background:var(--a);box-shadow:0 2px 4px #0009}.note h3{font-family:Georgia,serif;margin:0 0 9px}.note p{font-family:Georgia,serif;line-height:1.55;font-size:14px}.tag{display:inline-block;background:#211a14;color:#f3c790;border-radius:5px;padding:4px 7px;font:700 9px system-ui;letter-spacing:1px;text-transform:uppercase}.boardBottom{position:relative;margin-top:25px;display:flex;justify-content:space-between;align-items:center;gap:15px}.hint{color:#d2c2a8;font-size:13px}.draggable{cursor:grab}.dragging{opacity:.45}.dropzone{border:2px dashed #e7c89c88;border-radius:12px;padding:16px;text-align:center;color:#e7c89c;background:#0002;min-width:240px}
.investigation{max-width:1150px;margin:auto}.casePanel{background:linear-gradient(145deg,#19171a,#111012);border:1px solid #302d32;border-radius:20px;padding:30px;box-shadow:0 20px 60px #0007}.casePanel h2{font-size:40px;letter-spacing:-2px;margin-bottom:6px}.casePanel .sub{color:var(--a2)}.clueGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:25px 0}.clue{background:#201e20;border:1px solid #38343a;border-radius:14px;padding:18px;transition:.25s}.clue.locked{filter:blur(3px);opacity:.5}.clue.unlocked{border-color:var(--a);box-shadow:0 0 25px #ff7a1812}.clue h3{font-size:14px}.clue p{color:#aaa;line-height:1.6;font-size:13px}.reveal{margin-top:18px;color:#aaa;font-size:13px}.choices{display:grid;gap:12px;margin:25px 0}.choice{border:1px solid #373339;background:#201e20;color:#eee;text-align:left;padding:17px;border-radius:12px;transition:.2s}.choice:hover{border-color:var(--a);transform:translateX(4px)}.choice.correct{border-color:var(--green);background:#123021}.choice.wrong{border-color:var(--red);background:#321818}.feedback{padding:18px;border-radius:12px;background:#151417;border:1px solid #333;margin:15px 0;line-height:1.65}.solveActions{display:flex;gap:10px;justify-content:flex-end}
.closeOverlay{position:fixed;inset:0;background:#050505f5;z-index:20;display:grid;place-items:center;text-align:center}.stamp{font:900 clamp(48px,10vw,130px) Georgia,serif;color:var(--a);border:8px solid var(--a);padding:15px 28px;transform:rotate(-8deg);animation:stamp .65s cubic-bezier(.2,.8,.2,1)}@keyframes stamp{from{transform:scale(2.3) rotate(-18deg);opacity:0}to{transform:scale(1) rotate(-8deg);opacity:1}}.closeOverlay p{color:#aaa;margin-top:25px}
.report{max-width:1200px;margin:auto}.reportHead{padding:35px;border-radius:20px;background:linear-gradient(135deg,#201d1f,#121113);border:1px solid #373238}.reportHead h2{font-size:52px;letter-spacing:-3px;margin:8px 0}.score{font-size:60px;color:var(--a2);font-weight:900}.reportGrid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:18px}.reportCard{background:#181619;border:1px solid #302c31;border-radius:16px;padding:23px}.reportCard h3{margin-bottom:15px}.reportCard p,.reportCard li{color:#aaa;line-height:1.65}.metric{margin:15px 0}.metricTop{display:flex;justify-content:space-between;font-size:12px;color:#aaa}.track{height:8px;background:#29272a;border-radius:10px;overflow:hidden;margin-top:6px}.fill{height:100%;width:0;background:linear-gradient(90deg,var(--a),var(--a2));transition:width 1.2s ease}.chart{height:190px;display:flex;align-items:end;gap:10px;border-bottom:1px solid #39353a;padding:10px}.chartBar{flex:1;background:linear-gradient(#ffb15c,#ff7a18);border-radius:5px 5px 0 0;height:10%;animation:chart 1s ease forwards;transform-origin:bottom}@keyframes chart{from{height:0}}.chartLabel{font-size:10px;color:#777;text-align:center;margin-top:5px}.tip{border-left:3px solid var(--a);padding-left:14px}.footerActions{display:flex;gap:10px;margin-top:22px}
@media(max-width:850px){.themes{grid-template-columns:repeat(2,1fr)}.assignment{grid-template-columns:1fr}.photo{max-width:500px;width:100%;margin:auto}.evidence,.clueGrid,.reportGrid{grid-template-columns:1fr}.screen{padding:16px}.board{padding:25px 16px}.boardTitle{display:block}.solveActions{justify-content:stretch}.solveActions button{flex:1}}@media(max-width:520px){.themeCard{padding:28px 20px}.folder{padding:27px 22px}.folder h2{font-size:42px}.themes{grid-template-columns:1fr 1fr}.top{align-items:flex-start}.top .secondary{padding:9px}.fake{height:210px}}
</style>
</head>
<body><div id="app"></div>
<script>
"use strict";
const themes=[{name:"Claude Orange",c:"#ff7a18",c2:"#ffb15c"},{name:"Neon Noir",c:"#00e5ff",c2:"#8a7cff"},{name:"Emerald Case",c:"#43d17b",c2:"#b2f7c8"},{name:"Crimson File",c:"#f04462",c2:"#ff9a7a"}];
const cases=[
{company:"Luna Brew",industry:"Specialty Coffee",objective:"Increase online orders for a new cold-brew range.",audience:"18–28 year-old urban students and first-job professionals.",channels:["Instagram","TikTok","Email"],budget:{"Paid Social":"$18,000",Creators:"$9,000",Email:"$3,000"},metrics:{reach:"1.84M",ctr:"0.62%",engagement:"7.8%",conversions:"1,126",sales:"$41,900"},comments:["The videos look amazing, but I cannot tell where to order.","Loved the recipe content. The product link was hard to find.","I thought this was a coffee tutorial, not an ad."],social:"Short-form videos generated huge views and saves. Creator posts were widely shared, but product clicks stayed weak.",mistake:"The campaign optimized for entertainment rather than a clear purchase path.",clues:["CTR is far below the engagement rate despite strong reach.","Customers repeatedly mention difficulty finding the order link.","Creator videos received strong saves and shares but weak conversion activity."],explanation:"Luna Brew built attention without connecting attention to action. The creative was successful as content but failed as a conversion journey.",improvements:["Use a single obvious CTA in every creative.","Build landing pages matching each creator's promise.","Retarget video viewers with product-led ads and limited offers."]},
{company:"Northstar Bikes",industry:"Urban Mobility",objective:"Generate qualified leads for premium commuter bicycles.",audience:"25–45 year-old city commuters with mid-to-high disposable income.",channels:["Google Search","LinkedIn","Outdoor"],budget:{Search:"$22,000",LinkedIn:"$16,000",Outdoor:"$12,000"},metrics:{reach:"680K",ctr:"4.9%",engagement:"3.1%",conversions:"184",sales:"$112,400"},comments:["I wanted to compare models but the page only showed one bike.","The ad promised a test ride, but I had to hunt for the form.","Great product, confusing website."],social:"LinkedIn posts earned moderate engagement while search ads produced the highest-intent traffic.",mistake:"The campaign sent every audience segment to the same generic landing page.",clues:["Search CTR is strong, showing high intent.","Customers complain about missing comparison and test-ride paths.","Search generated most conversions while broad channels underperformed."],explanation:"Northstar had good demand capture but poor message-to-page matching. Different intents needed different landing experiences.",improvements:["Create model-specific landing pages.","Match ads to test-ride, comparison, and pricing intents.","Shift budget toward high-intent search terms."]},
{company:"Mira Skin",industry:"Beauty",objective:"Launch a sensitive-skin moisturizer.",audience:"20–35 year-old consumers researching gentle skincare.",channels:["Instagram","YouTube","Micro-influencers"],budget:{Creators:"$20,000",Video:"$14,000",Paid:"$6,000"},metrics:{reach:"2.7M",ctr:"1.8%",engagement:"9.6%",conversions:"392",sales:"$28,700"},comments:["Every creator says it works instantly. That feels exaggerated.","I wanted ingredient details before buying.","The comments had questions but nobody answered them."],social:"Influencer content drove exceptional comments and saves, especially around before/after claims.",mistake:"Mira Skin treated influencer reach as the end goal and failed to manage purchase objections.",clues:["Comment volume is high but many comments are unanswered questions.","Customers request ingredient and proof information.","Conversions are low relative to creator engagement."],explanation:"The campaign created curiosity but left trust gaps unresolved. High engagement became a queue of unanswered buying objections.",improvements:["Add expert-led ingredient explainers.","Use community managers to answer questions quickly.","Retarget engaged viewers with proof, FAQs, and reviews."]},
{company:"OrbitLearn",industry:"EdTech",objective:"Increase paid subscriptions for a coding course.",audience:"College students preparing for software internships.",channels:["YouTube","Search","Campus ambassadors"],budget:{YouTube:"$30,000",Search:"$15,000",Campus:"$10,000"},metrics:{reach:"1.1M",ctr:"2.9%",engagement:"6.2%",conversions:"1,740",sales:"$86,300"},comments:["The free lessons are excellent, but I do not know what I get after paying.","The internship promise sounds good but feels vague.","I signed up for a free lesson and never got a follow-up."],social:"Tutorial clips had high completion rates and strong comments from students.",mistake:"OrbitLearn acquired leads but failed to nurture them toward the paid offer.",clues:["Free lesson sign-ups are much higher than paid conversions.","Users say the paid value proposition is unclear.","No follow-up sequence was sent after the free lesson."],explanation:"The campaign solved acquisition but ignored the middle of the funnel. Students needed proof, curriculum clarity, and timely follow-up.",improvements:["Build a 5–7 day email nurture sequence.","Show curriculum, projects, mentor access, and outcomes.","Offer a time-limited student upgrade."]},
{company:"FreshFork",industry:"Food Delivery",objective:"Win back customers who stopped ordering.",audience:"Former customers inactive for 60–180 days.",channels:["Email","Push notifications","SMS"],budget:{Email:"$5,000",Push:"$3,000",SMS:"$4,000"},metrics:{reach:"420K",ctr:"3.4%",engagement:"2.1%",conversions:"2,940",sales:"$97,600"},comments:["The discount was good but I had already deleted the app.","The message arrived while I was at work.","I only came back because my favorite restaurant was included."],social:"Organic social was not part of the campaign. Retargeting performed better when tied to favorite restaurants.",mistake:"The campaign used one generic discount instead of behavior-based win-back messages.",clues:["Customers react to specific restaurants more than generic discounts.","Timing complaints appear in customer feedback.","Returning customers have different reasons for becoming inactive."],explanation:"FreshFork treated churned users as one audience. Relevance, timing, and past behavior mattered more than discount size.",improvements:["Segment by past order behavior.","Personalize restaurant and cuisine recommendations.","Test send-time optimization."]},
{company:"VoltRide",industry:"Electric Scooters",objective:"Drive awareness and preorders for a new scooter.",audience:"Young professionals and short-distance commuters.",channels:["TikTok","Outdoor","Influencers"],budget:{TikTok:"$25,000",Outdoor:"$18,000",Creators:"$17,000"},metrics:{reach:"4.8M",ctr:"0.41%",engagement:"11.2%",conversions:"238",sales:"$19,900"},comments:["The scooter looks cool. Is it actually safe?","I could not find battery range in the video.","Why should I preorder now?"],social:"The campaign became highly shareable and generated thousands of comments about design.",mistake:"VoltRide led with lifestyle aesthetics while hiding the functional information buyers needed.",clues:["Engagement is extremely high but CTR is extremely low.","Comments focus on safety, range, and preorder value.","Creative spends most of its time on visual lifestyle scenes."],explanation:"The campaign generated desire but not confidence. Product information was missing at the exact moment prospects were evaluating the purchase.",improvements:["Put range, warranty, safety, and preorder benefits into creatives.","Use creator reviews and demonstrations.","Retarget engaged viewers with specification-led ads."]},
{company:"Atlas Home",industry:"Furniture",objective:"Increase sales of ergonomic home-office furniture.",audience:"Remote workers aged 25–44.",channels:["Pinterest","Instagram","Google Shopping"],budget:{Pinterest:"$10,000",Instagram:"$14,000","Google Shopping":"$26,000"},metrics:{reach:"950K",ctr:"3.7%",engagement:"5.4%",conversions:"684",sales:"$174,200"},comments:["I liked the desk but delivery cost surprised me.","The photos did not show the desk size clearly.","I left because assembly information was missing."],social:"Pinterest produced strong saves and assisted conversions. Shopping ads drove the most direct revenue.",mistake:"Atlas optimized creative but failed to communicate purchase friction such as shipping and assembly.",clues:["Shopping produces the strongest sales efficiency.","Comments repeatedly mention delivery and assembly uncertainty.","Pinterest saves are high, suggesting strong product interest."],explanation:"Demand existed, but hidden practical details created checkout friction. The campaign needed better product information, not simply more traffic.",improvements:["Show delivery costs earlier.","Add dimensions and assembly videos.","Use Pinterest as discovery and Shopping as conversion capture."]},
{company:"PulseFit",industry:"Fitness App",objective:"Reduce cost per new subscriber.",audience:"Busy professionals seeking short home workouts.",channels:["Meta","YouTube","App Store Search"],budget:{Meta:"$28,000",YouTube:"$12,000","App Store Search":"$10,000"},metrics:{reach:"3.2M",ctr:"1.2%",engagement:"4.8%",conversions:"3,200",sales:"$64,000"},comments:["The ad says five-minute workouts, but onboarding asks too many questions.","I wanted to start immediately.","The app looks good but the free trial setup is confusing."],social:"Workout clips performed well and earned high watch time.",mistake:"PulseFit optimized the ad promise but created friction after the click.",clues:["Ads promise immediate five-minute workouts.","Users complain about long onboarding.","Conversion drop occurs after the click rather than before it."],explanation:"The acquisition message created a clear expectation of speed, but the product experience contradicted that promise.",improvements:["Reduce onboarding steps.","Let users start a workout before profile completion.","Align ad promise and first-session experience."]},
{company:"TinyTrail",industry:"Travel",objective:"Increase weekend getaway bookings.",audience:"Couples and friend groups within a four-hour travel radius.",channels:["Instagram","Google","Email"],budget:{Instagram:"$16,000",Google:"$19,000",Email:"$5,000"},metrics:{reach:"1.6M",ctr:"2.6%",engagement:"8.4%",conversions:"512",sales:"$138,500"},comments:["The destination looked beautiful but I did not know the total package price.","I needed dates before I could decide.","The email was inspiring but had no specific offer."],social:"Reels had excellent saves and shares, especially destination inspiration.",mistake:"TinyTrail sold inspiration instead of a bookable, date-specific offer.",clues:["High saves indicate travel intent.","Customers ask for price and date information.","Email engagement is healthy but bookings remain weak."],explanation:"People were dreaming about the trip but lacked the concrete information needed to commit. Inspiration needed to transition into a packaged offer.",improvements:["Promote specific weekend packages.","Show all-in pricing and availability.","Retarget savers with dates and urgency."]},
{company:"ClearDesk",industry:"B2B SaaS",objective:"Book demos for an AI meeting assistant.",audience:"Operations and sales leaders at 50–500 employee companies.",channels:["LinkedIn","Webinars","Email"],budget:{LinkedIn:"$24,000",Webinars:"$11,000",Email:"$5,000"},metrics:{reach:"310K",ctr:"1.9%",engagement:"4.2%",conversions:"76",sales:"$156,000"},comments:["I understand what it does, but not why I should switch.","The webinar was useful but the demo request felt aggressive.","I need security information before involving IT."],social:"LinkedIn thought-leadership posts performed better than product ads.",mistake:"ClearDesk led with product features before establishing business value and trust.",clues:["Thought-leadership content outperforms product ads.","Prospects ask for security and switching justification.","Demo conversions remain low despite qualified engagement."],explanation:"The audience was not lacking awareness of the product category; they lacked a business case and risk-reduction proof.",improvements:["Lead with measurable business outcomes.","Publish security and implementation resources.","Use educational content to warm prospects before demo asks."]}
];
let state={theme:0,case:null,step:0,found:0,selected:null,answered:false,score:0,dragCount:0};
function setTheme(i){state.theme=i;document.documentElement.style.setProperty("--a",themes[i].c);document.documentElement.style.setProperty("--a2",themes[i].c2);document.querySelectorAll(".themePick").forEach((x,n)=>x.classList.toggle("selected",n===i));}
function pickCase(){state.case=cases[Math.floor(Math.random()*cases.length)];state.step=1;state.found=0;state.selected=null;state.answered=false;state.score=0;state.dragCount=0;render();}
function header(){return `<div class="top"><div class="brand"><div class="brandIcon">🔎</div><div><strong>MARKETING DETECTIVE</strong><small> Case Intelligence Unit</small></div></div><button class="secondary" onclick="showTheme()">Change Theme</button></div><div class="progress">${[1,2,3,4,5,6].map((n,i)=>`<div class="bar ${state.step>=i+1?"on":""}"></div>`).join("")}</div>`;}
function showTheme(){state.step=0;render();}
function assignment(){const c=state.case;return `<div class="screen"><div class="wrap">${header()}<div class="assignment"><section class="folder"><div class="eyebrow">Assignment #${String(cases.indexOf(c)+1).padStart(2,"0")}</div><div class="company">${c.company}</div><h2>The Missing Conversion</h2><div class="meta"><span class="pill">${c.industry}</span><span class="pill">Objective: ${c.objective}</span></div><p class="brief">Detective, the campaign created enough noise to attract attention — but something went wrong before the money reached the register. Your job is to inspect the evidence, connect the clues, and identify the <b>primary marketing mistake</b>.</p><button class="primary" onclick="goBoard()">Open Case File →</button></section><aside class="photo"><div class="fake">☕</div><p>${c.company} — evidence photograph</p></aside></div></div></div>`;}
function goBoard(){state.step=2;render();}
function board(){const c=state.case;const items=[["CAMPAIGN BRIEF",`<b>Audience:</b> ${c.audience}<br><br><b>Channels:</b> ${c.channels.join(", ")}`],["BUDGET",Object.entries(c.budget).map(x=>`<b>${x[0]}</b>: ${x[1]}`).join("<br>")],["METRICS",`Reach <b>${c.metrics.reach}</b><br>CTR <b>${c.metrics.ctr}</b><br>Engagement <b>${c.metrics.engagement}</b><br>Conversions <b>${c.metrics.conversions}</b><br>Sales <b>${c.metrics.sales}</b>`],["CUSTOMER VOICES",c.comments.map(x=>`“${x}”`).join("<br><br>")],["SOCIAL TRACE",c.social],["DRAG THE RED PIN",`Three clues are hidden. Move this evidence into the interrogation area to unlock the first clue.`]];return `<div class="screen"><div class="wrap">${header()}<div class="board"><div class="boardTitle"><div><div class="eyebrow">Evidence Board</div><h2>Follow the Money. Follow the Attention.</h2><p>Nothing here is decorative. Every detail can change your theory.</p></div><span class="tag">${state.found}/3 clues surfaced</span></div><div class="evidence">${items.map((x,i)=>`<article class="note ${i===5?"draggable":""}" ${i===5?'draggable="true" ondragstart="dragStart(event)"':''}><span class="pin"></span><h3>${x[0]}</h3><p>${x[1]}</p></article>`).join("")}</div><div class="boardBottom"><div class="dropzone" id="drop" ondragover="event.preventDefault()" ondrop="dropEvidence(event)">Drop evidence here to interrogate it</div><div class="hint">Tip: engagement is not the same as intent.</div><button class="primary" onclick="investigate()">Begin Interrogation →</button></div></div></div></div>`;}
function dragStart(e){e.dataTransfer.setData("text/plain","evidence");}
function dropEvidence(){state.found=Math.min(3,state.found+1);state.dragCount++;const dz=document.getElementById("drop");if(dz)dz.textContent=`Evidence accepted — ${state.found}/3 clue(s) surfaced`;if(state.found===3)setTimeout(()=>investigate(),500);}
function investigate(){state.step=3;render();}
function investigation(){const c=state.case;return `<div class="screen"><div class="wrap">${header()}<div class="investigation"><div class="casePanel"><div class="eyebrow">Interactive Investigation</div><h2>What doesn't add up?</h2><div class="sub">${c.company} • ${c.industry}</div><p class="brief">Inspect each clue. Do not jump to the answer. A good detective asks which evidence explains the <i>largest</i> performance gap.</p><div class="clueGrid">${c.clues.map((x,i)=>`<div class="clue ${state.found>i?"unlocked":"locked"}"><h3>CLUE ${i+1}</h3><p>${state.found>i?x:"Evidence concealed. Return to the board and surface more evidence."}</p></div>`).join("")}</div><div class="reveal">${state.found<3?"You need all three clues before the suspect list can be opened.":"All evidence is now visible. Choose the mistake that best explains the entire pattern."}</div>${state.found>=3?`<div class="solveActions"><button class="primary" onclick="solve()">Open Suspect List →</button></div>`:`<div class="solveActions"><button class="secondary" onclick="goBoard()">← Return to Board</button></div>`}</div></div></div></div>`;}
function solve(){state.step=4;render();}
function solveScreen(){const c=state.case;const options=[c.mistake,"The campaign failed mainly because the brand did not spend enough money.","The audience was completely wrong and should be replaced.","The campaign needed more social media posts before it could succeed."];return `<div class="screen"><div class="wrap">${header()}<div class="investigation"><div class="casePanel"><div class="eyebrow">Final Deduction</div><h2>Name the culprit.</h2><p class="brief">One theory explains the evidence better than the others. Choose carefully — your explanation is more important than the click.</p><div class="choices">${options.map((x,i)=>`<button class="choice" onclick="answer(${i},this)">${String.fromCharCode(65+i)}. ${x}</button>`).join("")}</div><div id="feedback"></div></div></div></div></div>`;}
function answer(i){if(state.answered)return;state.answered=true;const correct=i===0;state.score=correct?100:45;document.querySelectorAll(".choice").forEach((b,n)=>{if(n===0)b.classList.add("correct");else if(n===i)b.classList.add("wrong")});document.getElementById("feedback").innerHTML=`<div class="feedback"><b>${correct?"Case-breaking deduction.":"Close, but the evidence points elsewhere."}</b><br>${state.case.explanation}<br><br><button class="primary" onclick="closeCase()">Close the Case →</button></div>`;}
function closeCase(){state.step=5;render();setTimeout(()=>{state.step=6;render()},1800);}
function report(){const c=state.case;const vals=[["Reach","Awareness","78%"],["CTR","Attention","52%"],["Engagement","Interest","86%"],["Conversions","Action",state.score+"%"],["Sales","Business impact",Math.min(100,state.score+8)+"%"]];return `<div class="screen"><div class="wrap">${header()}<div class="report"><section class="reportHead"><div class="eyebrow">Learning Report</div><h2>Case Closed: ${c.company}</h2><div class="score">${state.score}/100</div><p class="brief">You identified the primary marketing mistake and can now turn the evidence into a reusable marketing principle.</p></section><div class="reportGrid"><article class="reportCard"><h3>📊 Campaign Signal</h3>${vals.map(v=>`<div class="metric"><div class="metricTop"><span>${v[0]} — ${v[1]}</span><b>${v[2]}</b></div><div class="track"><div class="fill" style="width:${v[2]}"></div></div></div>`).join("")}</article><article class="reportCard"><h3>📈 Funnel Pattern</h3><div class="chart">${[35,58,72,51,39].map((h,i)=>`<div style="flex:1"><div class="chartBar" style="height:${h}%"></div><div class="chartLabel">${["Reach","Click","Engage","Convert","Sale"][i]}</div></div>`).join("")}</div><p class="tip">Detective lesson: a strong top-of-funnel signal can still hide a broken conversion journey.</p></article><article class="reportCard"><h3>🎯 Primary Mistake</h3><p><b>${c.mistake}</b></p><p>${c.explanation}</p></article><article class="reportCard"><h3>🧠 Recommended Moves</h3><ul>${c.improvements.map(x=>`<li>${x}</li>`).join("")}</ul></article></div><div class="footerActions"><button class="primary" onclick="pickCase()">Investigate Another Case ↻</button><button class="secondary" onclick="showTheme()">Change Theme</button></div></div></div></div>`;}
function closed(){return `<div class="closeOverlay"><div><div class="stamp">CASE CLOSED</div><p>Evidence connected. Marketing lesson extracted.</p></div></div>`;}
function render(){const app=document.getElementById("app");if(state.step===0){app.innerHTML=`<div class="theme"><div class="themeCard"><div class="logo">🔎</div><div class="eyebrow">Interactive Marketing Mystery</div><h1>Marketing Detective</h1><p>Every campaign leaves fingerprints. Choose your visual file, then investigate fictional campaigns where the numbers, customer voices, and social signals tell a different story.</p><div class="themes">${themes.map((t,i)=>`<button class="themePick ${i===state.theme?"selected":""}" style="--c:${t.c}" onclick="setTheme(${i})"><div class="swatch"></div><strong>${t.name}</strong><small>Case atmosphere</small></button>`).join("")}</div><button class="primary" onclick="pickCase()">Accept First Case →</button></div></div>`;}else if(state.step===1)app.innerHTML=assignment();else if(state.step===2)app.innerHTML=board();else if(state.step===3)app.innerHTML=investigation();else if(state.step===4)app.innerHTML=solveScreen();else if(state.step===5)app.innerHTML=closed();else app.innerHTML=report();}
setTheme(0);render();
</script></body></html>
