<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hospital Admission Readiness Simulator</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/js/all.min.js"></script>
<style>
  :root{--ink:#0f2a3d;--ink-soft:#3c5568;--paper:#f3f6f5;--panel:#ffffff;--line:#d7e0e0;--teal:#0b6e6e;--teal-deep:#075353;--amber:#a8641a;--amber-bg:#fdf1e0;--red:#a3282e;--red-bg:#fbe9e8;--green:#1e6b45;--green-bg:#e7f4ec;--slate-bg:#eef2f2}
  body{font-family:'IBM Plex Sans',ui-sans-serif,system-ui;background:var(--paper);color:var(--ink)}.font-display{font-family:'Source Serif 4','IBM Plex Serif',ui-serif,Georgia,serif}.mono{font-family:'IBM Plex Mono',ui-monospace,monospace}.card{background:var(--panel);border:1px solid var(--line);border-radius:10px}.chip{border:1px solid var(--line);border-radius:999px}::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:#c3d0d0;border-radius:4px}.pulse-dot{animation:pulse 1.8s ease-in-out infinite}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}.fade-in{animation:fadeIn .4s ease both}@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}.bar-fill{transition:width .8s cubic-bezier(.4,0,.2,1)}input[type=text],input[type=date],select{background:#fff;border:1px solid var(--line);border-radius:8px;padding:.55rem .75rem;font-size:.875rem;color:var(--ink);width:100%}input:focus,select:focus{outline:2px solid var(--teal);outline-offset:1px;border-color:var(--teal)}label.field-label{font-size:.72rem;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-soft);font-weight:600}.btn-primary{background:var(--teal);color:#fff;border-radius:8px;font-weight:600;transition:background .15s}.btn-primary:hover{background:var(--teal-deep)}.btn-primary:disabled{background:#9fb3b3;cursor:not-allowed}.btn-secondary{background:#fff;border:1px solid var(--line);color:var(--ink);border-radius:8px;font-weight:600;transition:all .15s}.btn-secondary:hover{border-color:var(--teal);color:var(--teal-deep);background:var(--slate-bg)}.btn-secondary:disabled{opacity:.45;cursor:not-allowed}.status-dot{width:8px;height:8px;border-radius:999px;display:inline-block}.timeline-line{background:linear-gradient(to bottom,var(--line) 0%,var(--line) 100%)}
</style></head><body class="min-h-screen"><div id="app" class="max-w-6xl mx-auto px-4 md:px-6 py-6 md:py-10"></div><script>
const DIAGNOSES=["Acute MI","CHF","Pneumonia","Elective Surgery","Hip Fracture"];const ADMISSION_TYPES=["Inpatient","Observation","Emergency","ICU","Same-Day Surgery"];const CRITERIA_DX=["Acute MI","CHF"];const HIGH_CLINICAL_RISK_DX=["Acute MI","CHF"];
let state={screen:"setup",form:{provider:"",attending:"",diagnosis:"",admissionType:"",paStatusInput:"Pending",admissionDate:""},pa:{status:"Pending",appealSubmitted:false,appealResolved:false},domains:{pa:{status:"pending",label:"Pending Review"},insurance:{status:"pending",label:"Not Verified"},bed:{status:"pending",label:"Not Assigned"},documentation:{status:"pending",label:"Incomplete"},orders:{status:"pending",label:"Not Received"},consent:{status:"pending",label:"Not Signed"}},actionsLog:[],milestones:{"PA Review":"pending","Insurance Verification":"pending","Bed Assignment":"pending","Documentation":"pending","Consent":"pending","Patient Arrival":"pending","Registration":"pending","Clinical Assessment":"pending","Admission Complete":"pending"},score:0};
const WEIGHTS={pa:25,documentation:20,orders:20,insurance:15,consent:10,bed:10};
function computeScore(){const sub={};sub.pa=state.domains.pa.status==="approved"?1:state.domains.pa.status==="pending"?.35:.05;sub.documentation=state.domains.documentation.status==="complete"?1:state.domains.documentation.status==="partial"?.5:.1;sub.orders=state.domains.orders.status==="complete"?1:.15;sub.insurance=state.domains.insurance.status==="verified"?1:.2;sub.consent=state.domains.consent.status==="signed"?1:.05;sub.bed=state.domains.bed.status==="assigned"?1:.1;let raw=0;for(const k in WEIGHTS)raw+=sub[k]*WEIGHTS[k];if(state.form.admissionType==="ICU"&&state.domains.pa.status==="denied")raw=Math.min(raw,69);return Math.round(Math.max(0,Math.min(100,raw)))}
function isHighClinicalRisk(){return HIGH_CLINICAL_RISK_DX.includes(state.form.diagnosis)||state.form.admissionType==="ICU"}
function render(){const app=document.getElementById('app');if(state.screen==="setup")app.innerHTML=renderSetup();else app.innerHTML=renderWorkspace();attachHandlers()}
function headerBar(subtitle){return `<div class="flex items-start justify-between mb-8 pb-5 border-b" style="border-color:var(--line)"><div><div class="flex items-center gap-2 mb-1"><div class="w-8 h-8 rounded-md flex items-center justify-center" style="background:var(--teal)"><i class="fa-solid fa-hospital text-white text-sm"></i></div><h1 class="font-display text-xl md:text-2xl font-semibold" style="color:var(--ink)">Hospital Admission Readiness Simulator</h1></div><p class="text-sm" style="color:var(--ink-soft)">${subtitle}</p></div><span class="mono text-[10px] px-2 py-1 rounded chip" style="color:var(--ink-soft)">TRAINING SIMULATION</span></div>`}
function renderSetup(){const f=state.form;const canAnalyze=f.provider&&f.attending&&f.diagnosis&&f.admissionType&&f.admissionDate;return `${headerBar("Enter admission details to begin the coordination workflow.")}<div class="card p-6 md:p-8 max-w-3xl mx-auto fade-in"><div class="flex items-center gap-2 mb-6"><i class="fa-regular fa-clipboard" style="color:var(--teal)"></i><h2 class="font-semibold text-base">New Admission Setup</h2></div><div class="grid md:grid-cols-2 gap-5"><div><label class="field-label">Provider (illustrative)</label><input type="text" id="in-provider" placeholder="e.g. Meridian Health Partners" value="${f.provider}" class="mt-1.5"></div><div><label class="field-label">Attending Physician (illustrative)</label><input type="text" id="in-attending" placeholder="e.g. Dr. R. Alvarez" value="${f.attending}" class="mt-1.5"></div><div><label class="field-label">Diagnosis</label><select id="in-diagnosis" class="mt-1.5"><option value="" disabled ${!f.diagnosis?"selected":""}>Select diagnosis</option>${DIAGNOSES.map(d=>`<option value="${d}" ${f.diagnosis===d?"selected":""}>${d}</option>`).join('')}</select></div><div><label class="field-label">Admission Type</label><select id="in-admtype" class="mt-1.5"><option value="" disabled ${!f.admissionType?"selected":""}>Select admission type</option>${ADMISSION_TYPES.map(d=>`<option value="${d}" ${f.admissionType===d?"selected":""}>${d}</option>`).join('')}</select></div><div><label class="field-label">Starting PA Status</label><select id="in-pastatus" class="mt-1.5">${["Approved","Pending","Denied"].map(s=>`<option value="${s}" ${f.paStatusInput===s?"selected":""}>${s}</option>`).join('')}</select></div><div><label class="field-label">Admission Date</label><input type="date" id="in-date" value="${f.admissionDate}" class="mt-1.5"></div></div>${f.admissionType==="Observation"?`<div class="mt-5 p-3.5 rounded-lg text-sm flex gap-2.5" style="background:var(--amber-bg);border:1px solid #eecfa0;"><i class="fa-solid fa-triangle-exclamation mt-0.5" style="color:var(--amber)"></i><p style="color:#7a4c14"><span class="font-semibold">CMS 2-Midnight Rule applies</span> — different cost-sharing, SNF eligibility, and billing than inpatient. Medicare patients require written MOON notification.</p></div>`:``}${CRITERIA_DX.includes(f.diagnosis)?`<div class="mt-3 p-3.5 rounded-lg text-sm flex gap-2.5" style="background:var(--slate-bg);border:1px solid var(--line);"><i class="fa-solid fa-book-medical mt-0.5" style="color:var(--teal)"></i><p style="color:var(--ink-soft)"><span class="font-semibold" style="color:var(--ink)">InterQual/Milliman thresholds apply</span> — ensure documentation meets medical necessity standards before UR review.</p></div>`:``}<button id="btn-analyze" ${canAnalyze?"":"disabled"} class="btn-primary w-full mt-7 py-3 text-sm">🏥 Analyze Admission Readiness</button>${!canAnalyze?`<p class="text-xs text-center mt-2" style="color:var(--ink-soft)">Complete all fields to continue</p>`:``}</div>`}
function runInitialAnalysis(){const p=state.form.paStatusInput;state.pa.status=p.toLowerCase();state.domains.pa.status=p.toLowerCase();state.domains.pa.label=p==="Approved"?"Authorized":p==="Denied"?"Denied":"Pending Review";state.domains.insurance={status:"pending",label:"Verification In Progress"};state.domains.bed={status:"pending",label:"Awaiting Assignment"};state.domains.documentation={status:"partial",label:"Partially Complete"};state.domains.orders={status:"pending",label:"Awaiting Physician Orders"};state.domains.consent={status:"pending",label:"Not Yet Signed"};state.milestones["PA Review"]=p==="Approved"?"complete":p==="Denied"?"attention":"in-progress";state.score=computeScore();state.score=Math.max(30,Math.min(60,state.score));state.screen="initial"}
function renderWorkspace(){const f=state.form;return `${headerBar(`${f.diagnosis} · ${f.admissionType} · ${f.attending} <span class="mono text-xs">(illustrative)</span>`)}${renderScoreBar()}<div class="grid lg:grid-cols-3 gap-6 mt-6"><div class="lg:col-span-2 space-y-6">${renderDomainStatus()}${renderPABranch()}${renderRiskTracking()}${state.score>=75?renderGovernanceSnapshot():``}${state.screen==="final"?renderFinalDecision():renderActionsPanel()}</div><div class="space-y-6">${renderTimeline()}${renderCareCoordination()}</div></div><div class="text-center mt-8"><button id="btn-restart" class="text-xs underline" style="color:var(--ink-soft)">Start a new admission simulation</button></div>`}
function renderScoreBar(){const s=state.score;const color=s>=90?"var(--green)":s>=75?"var(--teal)":s>=50?"var(--amber)":"var(--red)";return `<div class="card p-5 fade-in"><div class="flex items-center justify-between mb-2"><div class="flex items-center gap-2"><i class="fa-solid fa-gauge-high" style="color:${color}"></i><span class="font-semibold text-sm">Readiness Score</span></div><span class="font-display text-2xl font-semibold" style="color:${color}">${s}%</span></div><div class="w-full h-2.5 rounded-full overflow-hidden" style="background:var(--slate-bg)"><div class="h-full rounded-full bar-fill" style="width:${s}%;background:${color}"></div></div><div class="flex flex-wrap gap-x-4 gap-y-1 mt-3 text-[11px] mono" style="color:var(--ink-soft)"><span>PA 25%</span><span>Documentation 20%</span><span>Orders 20%</span><span>Insurance 15%</span><span>Consent 10%</span><span>Bed 10%</span></div>${state.form.admissionType==="ICU"&&state.domains.pa.status==="denied"?`<p class="text-xs mt-3 flex items-center gap-1.5" style="color:var(--red)"><i class="fa-solid fa-lock"></i> ICU admission with denied PA cannot exceed 69% from administrative tasks alone.</p>`:``}</div>`}
const DOMAIN_META={pa:{icon:"fa-file-shield",name:"Prior Authorization"},insurance:{icon:"fa-id-card",name:"Insurance"},bed:{icon:"fa-bed-pulse",name:"Bed"},documentation:{icon:"fa-file-lines",name:"Documentation"},orders:{icon:"fa-user-doctor",name:"Physician Orders"},consent:{icon:"fa-signature",name:"Consent"}};
function statusColor(status){if(["approved","complete","verified","assigned","signed"].includes(status))return{c:"var(--green)",bg:"var(--green-bg)"};if(["denied"].includes(status))return{c:"var(--red)",bg:"var(--red-bg)"};if(["partial","in-progress"].includes(status))return{c:"var(--amber)",bg:"var(--amber-bg)"};return{c:"var(--amber)",bg:"var(--amber-bg)"}}
function renderDomainStatus(){return `<div class="card p-5 fade-in"><div class="flex items-center gap-2 mb-4"><i class="fa-solid fa-list-check" style="color:var(--teal)"></i><h3 class="font-semibold text-sm">Admission Status Panel</h3></div><div class="grid sm:grid-cols-2 gap-3">${Object.keys(DOMAIN_META).map(k=>{const d=state.domains[k],m=DOMAIN_META[k],col=statusColor(d.status);return `<div class="rounded-lg p-3 flex items-start gap-3" style="background:${col.bg};border:1px solid ${col.c}33"><i class="fa-solid ${m.icon} mt-0.5" style="color:${col.c}"></i><div><p class="text-xs font-semibold" style="color:var(--ink)">${m.name}</p><p class="text-xs mt-0.5" style="color:${col.c}">${d.label}</p></div></div>`}).join('')}</div></div>`}
function renderPABranch(){const status=state.domains.pa.status;if(status==="approved")return `<div class="card p-5 fade-in" style="border-color:#bfe0cc"><div class="flex items-center gap-2"><i class="fa-solid fa-circle-check" style="color:var(--green)"></i><p class="text-sm font-semibold" style="color:var(--green)">Prior Authorization Approved</p></div><p class="text-xs mt-1" style="color:var(--ink-soft)">No further PA action required. Proceed with remaining admission workflow.</p></div>`;if(status==="denied")return `<div class="card p-5 fade-in" style="border-color:#e3b3b1"><div class="flex items-center gap-2 mb-3"><i class="fa-solid fa-circle-xmark" style="color:var(--red)"></i><p class="text-sm font-semibold" style="color:var(--red)">Prior Authorization Denied</p></div><p class="text-xs mb-4" style="color:var(--ink-soft)">Denial recorded for illustrative payer. Select next step to attempt resolution.</p><div class="flex flex-wrap gap-2"><button class="btn-secondary text-xs px-3 py-2 pa-action" data-action="review">📋 Review Reason</button><button class="btn-secondary text-xs px-3 py-2 pa-action" data-action="contact">📞 Contact Insurance</button><button class="btn-secondary text-xs px-3 py-2 pa-action" data-action="appeal" ${state.pa.appealSubmitted?"disabled":""}>${state.pa.appealSubmitted?"✔ Appeal Submitted":"⚖ Submit Appeal"}</button></div>${state.pa.appealSubmitted&&!state.pa.appealResolved?`<div class="mt-3 text-xs flex items-center gap-2" style="color:var(--amber)"><i class="fa-solid fa-spinner pulse-dot"></i> Appeal under review by illustrative payer utilization team...</div>`:``}${state.pa.appealResolved?`<div class="mt-3 text-xs flex items-center gap-2" style="color:var(--green)"><i class="fa-solid fa-circle-check"></i> Appeal successful — PA converted to Approved.</div>`:``}</div>`;return `<div class="card p-5 fade-in" style="border-color:#eecfa0"><div class="flex items-center gap-2 mb-3"><i class="fa-solid fa-hourglass-half" style="color:var(--amber)"></i><p class="text-sm font-semibold" style="color:var(--amber)">Prior Authorization Pending</p></div><p class="text-xs mb-4" style="color:var(--ink-soft)">Illustrative payer has not yet returned a determination.</p><div class="flex flex-wrap gap-2"><button class="btn-secondary text-xs px-3 py-2 pa-action" data-action="followup">🔁 Follow Up</button><button class="btn-secondary text-xs px-3 py-2 pa-action" data-action="upload">📤 Upload Docs</button><button class="btn-secondary text-xs px-3 py-2 pa-action" data-action="callphys">☎ Contact Physician</button></div></div>`}
function renderRiskTracking(){const hi=isHighClinicalRisk();const risks=[{key:"documentation",name:"Documentation Risk",level:state.domains.documentation.status==="complete"?"Low":state.domains.documentation.status==="partial"?"Moderate":"High"},{key:"insurance",name:"Insurance Risk",level:state.domains.insurance.status==="verified"?"Low":"Moderate"},{key:"bed",name:"Bed Risk",level:state.domains.bed.status==="assigned"?"Low":"Moderate"},{key:"clinical",name:"Clinical Risk",level:hi?(state.domains.documentation.status==="complete"?"Moderate":"High"):(state.domains.documentation.status==="complete"?"Low":"Moderate")}];const levelColor=l=>l==="Low"?{c:"var(--green)",bg:"var(--green-bg)"}:l==="Moderate"?{c:"var(--amber)",bg:"var(--amber-bg)"}:{c:"var(--red)",bg:"var(--red-bg)"};return `<div class="card p-5 fade-in"><div class="flex items-center gap-2 mb-1"><i class="fa-solid fa-triangle-exclamation" style="color:var(--teal)"></i><h3 class="font-semibold text-sm">Risk Tracking</h3></div>${hi?`<p class="text-xs mb-3" style="color:var(--ink-soft)">Clinical Risk is weighted higher for ${state.form.diagnosis==="Acute MI"||state.form.diagnosis==="CHF"?state.form.diagnosis:"ICU"} admissions.</p>`:`<div class="mb-3"></div>`}<div class="grid sm:grid-cols-2 gap-3">${risks.map(r=>{const col=levelColor(r.level);return `<div class="rounded-lg p-3 flex items-center justify-between" style="background:${col.bg}"><span class="text-xs font-medium" style="color:var(--ink)">${r.name}</span><span class="text-xs font-semibold px-2 py-0.5 rounded-full" style="color:${col.c};background:#fff">${r.level}</span></div>`}).join('')}</div></div>`}
function renderGovernanceSnapshot(){return `<div class="card p-5 fade-in" style="background:var(--slate-bg)"><div class="flex items-center gap-2 mb-2"><i class="fa-solid fa-chart-column" style="color:var(--teal-deep)"></i><h3 class="font-semibold text-sm">Governance Snapshot</h3></div><p class="text-xs leading-relaxed" style="color:var(--ink-soft)"><span class="font-semibold" style="color:var(--ink)">Industry benchmarks (estimates only):</span> PA turnaround 3–5 days · Inpatient denial rate ~8–10% (CMS) · PA rework cost ~$11/transaction (CAQH)</p></div>`}
const ACTIONS=[{key:"bed",label:"Assign Bed",icon:"fa-bed-pulse"},{key:"insurance",label:"Verify Insurance",icon:"fa-id-card"},{key:"documentation",label:"Upload Documentation",icon:"fa-file-arrow-up"},{key:"consent",label:"Complete Consent",icon:"fa-signature"},{key:"orders",label:"Contact Physician",icon:"fa-user-doctor"},{key:"nursing",label:"Notify Nursing",icon:"fa-bell"},{key:"arrival",label:"Prepare Patient Arrival",icon:"fa-house-medical"}];
function renderActionsPanel(){return `<div class="card p-5 fade-in"><div class="flex items-center gap-2 mb-4"><i class="fa-solid fa-bolt" style="color:var(--teal)"></i><h3 class="font-semibold text-sm">Workflow Actions</h3></div><div class="grid sm:grid-cols-2 gap-2.5">${ACTIONS.map(a=>`<button class="btn-secondary text-xs px-3 py-2.5 flex items-center gap-2 workflow-action" data-key="${a.key}"><i class="fa-solid ${a.icon}"></i> ${a.label}</button>`).join('')}</div>${state.actionsLog.length?`<div class="mt-4 pt-4 border-t" style="border-color:var(--line)"><p class="text-[11px] font-semibold uppercase tracking-wide mb-2" style="color:var(--ink-soft)">Action Log</p><div class="space-y-1.5 max-h-32 overflow-y-auto pr-1">${state.actionsLog.slice().reverse().map(l=>`<p class="text-xs flex items-center gap-1.5" style="color:var(--ink-soft)"><i class="fa-solid fa-check text-[10px]" style="color:var(--green)"></i>${l}</p>`).join('')}</div></div>`:``}<button id="btn-finalize" class="btn-primary w-full mt-5 py-2.5 text-sm">Run Final Readiness Decision</button></div>`}
function renderTimeline(){const keys=Object.keys(state.milestones);return `<div class="card p-5 fade-in"><div class="flex items-center gap-2 mb-4"><i class="fa-solid fa-timeline" style="color:var(--teal)"></i><h3 class="font-semibold text-sm">Admission Timeline</h3></div><div class="relative pl-6"><div class="absolute left-[7px] top-1 bottom-1 w-px timeline-line"></div>${keys.map(k=>{const st=state.milestones[k];const color=st==="complete"?"var(--green)":st==="attention"?"var(--red)":st==="in-progress"?"var(--amber)":"var(--line)";const icon=st==="complete"?"fa-check":st==="attention"?"fa-exclamation":st==="in-progress"?"fa-clock":"fa-circle";return `<div class="relative mb-4 last:mb-0"><div class="absolute -left-[22px] top-0.5 w-3.5 h-3.5 rounded-full flex items-center justify-center" style="background:${color}"><i class="fa-solid ${icon} text-[7px] text-white"></i></div><p class="text-xs font-medium" style="color:${st==='pending'?'var(--ink-soft)':'var(--ink)'}">${k}</p></div>`}).join('')}</div></div>`}
function renderCareCoordination(){const cards=[{name:"Attending",icon:"fa-user-doctor",detail:`${state.form.attending||"Unassigned"} — clinical decision authority, order confirmation.`},{name:"Case Manager",icon:"fa-user-nurse",detail:"Coordinates admission flow, discharge planning readiness, payer communication."},{name:"Nursing",icon:"fa-bell-concierge",detail:"Bed readiness, patient transfer logistics, initial clinical assessment prep."},{name:"Utilization Review",icon:"fa-magnifying-glass-chart",detail:"Conducts concurrent review and denial risk identification using InterQual and Milliman criteria to validate medical necessity."},{name:"Discharge Planner",icon:"fa-route",detail:"Early discharge disposition planning to reduce length-of-stay risk."}];return `<div class="card p-5 fade-in"><div class="flex items-center gap-2 mb-4"><i class="fa-solid fa-people-group" style="color:var(--teal)"></i><h3 class="font-semibold text-sm">Care Coordination</h3></div><div class="space-y-3">${cards.map(c=>`<div class="flex gap-3"><div class="w-8 h-8 rounded-md flex items-center justify-center shrink-0" style="background:var(--slate-bg)"><i class="fa-solid ${c.icon} text-xs" style="color:var(--teal-deep)"></i></div><div><p class="text-xs font-semibold">${c.name} <span class="mono text-[10px] font-normal" style="color:var(--ink-soft)">(illustrative)</span></p><p class="text-xs mt-0.5" style="color:var(--ink-soft)">${c.detail}</p></div></div>`).join('')}</div></div>`}
function renderFinalDecision(){const s=state.score;if(s>=90)return `<div class="card p-6 fade-in" style="background:var(--green-bg);border-color:#bfe0cc"><div class="flex items-center gap-2 mb-2"><i class="fa-solid fa-circle-check text-lg" style="color:var(--green)"></i><h3 class="font-display text-lg font-semibold" style="color:var(--green)">✅ Admit — Readiness Confirmed</h3></div><p class="text-sm mb-4" style="color:var(--ink-soft)">All administrative, clinical, and consent requirements have been met for this simulated admission.</p><div class="grid sm:grid-cols-2 gap-2 text-xs"><div class="bg-white rounded-lg p-3"><span class="font-semibold">Provider:</span> ${state.form.provider} <span class="mono text-[10px]">(illustrative)</span></div><div class="bg-white rounded-lg p-3"><span class="font-semibold">Attending:</span> ${state.form.attending} <span class="mono text-[10px]">(illustrative)</span></div><div class="bg-white rounded-lg p-3"><span class="font-semibold">Diagnosis:</span> ${state.form.diagnosis}</div><div class="bg-white rounded-lg p-3"><span class="font-semibold">Admission Type:</span> ${state.form.admissionType}</div><div class="bg-white rounded-lg p-3"><span class="font-semibold">PA Status:</span> Approved</div><div class="bg-white rounded-lg p-3"><span class="font-semibold">Admission Date:</span> ${state.form.admissionDate}</div></div><p class="text-xs mt-4" style="color:var(--ink-soft)">Final Readiness Score: <span class="font-semibold" style="color:var(--green)">${s}%</span></p></div>`;return `<div class="card p-6 fade-in" style="background:var(--amber-bg);border-color:#eecfa0"><div class="flex items-center gap-2 mb-2"><i class="fa-solid fa-triangle-exclamation text-lg" style="color:var(--amber)"></i><h3 class="font-display text-lg font-semibold" style="color:#7a4c14">⚠ Not Ready for Admission</h3></div><p class="text-sm mb-4" style="color:#7a4c14">Readiness Score: <span class="font-semibold">${s}%</span> — below the 90% threshold required to admit.</p></div>`}
function attachHandlers(){const $=id=>document.getElementById(id);if(state.screen==="setup"){$("in-provider")?.addEventListener('input',e=>{state.form.provider=e.target.value;refreshButton()});$("in-attending")?.addEventListener('input',e=>{state.form.attending=e.target.value;refreshButton()});$("in-diagnosis")?.addEventListener('change',e=>{state.form.diagnosis=e.target.value;render()});$("in-admtype")?.addEventListener('change',e=>{state.form.admissionType=e.target.value;render()});$("in-pastatus")?.addEventListener('change',e=>{state.form.paStatusInput=e.target.value});$("in-date")?.addEventListener('change',e=>{state.form.admissionDate=e.target.value;refreshButton()});$("btn-analyze")?.addEventListener('click',()=>{runInitialAnalysis();render()});return}document.querySelectorAll('.pa-action').forEach(btn=>btn.addEventListener('click',()=>handlePAAction(btn.dataset.action)));document.querySelectorAll('.workflow-action').forEach(btn=>btn.addEventListener('click',()=>handleWorkflowAction(btn.dataset.key,btn)));$("btn-finalize")?.addEventListener('click',()=>{state.screen="final";render()});$("btn-continue-work")?.addEventListener('click',()=>{state.screen="working";render()});$("btn-restart")?.addEventListener('click',()=>{resetState();render()})}
function refreshButton(){const f=state.form,btn=document.getElementById('btn-analyze');if(btn)btn.disabled=!(f.provider&&f.attending&&f.diagnosis&&f.admissionType&&f.admissionDate)}
function handlePAAction(action){if(action==="review"||action==="contact")state.actionsLog.push(action==="review"?"PA denial reason reviewed":"Insurance contacted regarding PA denial");else if(action==="appeal"){state.pa.appealSubmitted=true;state.actionsLog.push("Appeal submitted to illustrative payer");setTimeout(()=>{state.pa.appealResolved=true;state.domains.pa.status="approved";state.domains.pa.label="Authorized (via appeal)";state.milestones["PA Review"]="complete";state.actionsLog.push("Appeal successful — PA converted to Approved");state.score=computeScore();if(state.screen==="initial")state.screen="working";render()},1400)}else if(action==="followup"){state.actionsLog.push("Followed up on pending PA");state.domains.pa.label="Follow-up Logged — Awaiting Payer Response"}else if(action==="upload"){state.actionsLog.push("Supporting docs uploaded for PA review");state.domains.documentation.status="complete";state.domains.documentation.label="Complete";state.milestones["Documentation"]="complete"}else if(action==="callphys")state.actionsLog.push("Physician contacted regarding PA");state.score=computeScore();if(state.screen==="initial")state.screen="working";render()}
function handleWorkflowAction(key,btn){switch(key){case"bed":state.domains.bed={status:"assigned",label:"Bed Assigned"};state.milestones["Bed Assignment"]="complete";state.actionsLog.push("Bed assigned");break;case"insurance":state.domains.insurance={status:"verified",label:"Verified"};state.milestones["Insurance Verification"]="complete";state.actionsLog.push("Insurance verified");break;case"documentation":state.domains.documentation={status:"complete",label:"Complete"};state.milestones["Documentation"]="complete";state.actionsLog.push("Documentation uploaded");break;case"consent":state.domains.consent={status:"signed",label:"Signed"};state.milestones["Consent"]="complete";state.actionsLog.push("Consent completed");break;case"orders":state.domains.orders={status:"complete",label:"Received"};state.actionsLog.push("Physician contacted — orders received");break;case"nursing":state.actionsLog.push("Nursing notified of pending admission");break;case"arrival":state.milestones["Patient Arrival"]="complete";state.milestones["Registration"]="complete";state.milestones["Clinical Assessment"]="complete";state.actionsLog.push("Patient arrival prepared");break}state.screen="working";state.score=computeScore();render()}
function resetState(){state={screen:"setup",form:{provider:"",attending:"",diagnosis:"",admissionType:"",paStatusInput:"Pending",admissionDate:""},pa:{status:"Pending",appealSubmitted:false,appealResolved:false},domains:{pa:{status:"pending",label:"Pending Review"},insurance:{status:"pending",label:"Not Verified"},bed:{status:"pending",label:"Not Assigned"},documentation:{status:"pending",label:"Incomplete"},orders:{status:"pending",label:"Not Received"},consent:{status:"pending",label:"Not Signed"}},actionsLog:[],milestones:{"PA Review":"pending","Insurance Verification":"pending","Bed Assignment":"pending","Documentation":"pending","Consent":"pending","Patient Arrival":"pending","Registration":"pending","Clinical Assessment":"pending","Admission Complete":"pending"},score:0}}
render();
</script></body></html>
